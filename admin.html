<!DOCTYPE html>
<html>
<head>
  <title>Usama Bin Nusrat CRM</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.20), transparent 34%),
        radial-gradient(circle at top right, rgba(16, 185, 129, 0.14), transparent 32%),
        linear-gradient(135deg, #070a10, #0b0f16);
      color: #e5e7eb;
      font-family: 'Poppins', sans-serif;
      padding: 28px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
    }

    .title-block h2 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.8px;
    }

    .title-block p {
      margin: 7px 0 0;
      color: #8b95a7;
      font-size: 13px;
    }

    .status-pill {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.28);
      color: #86efac;
      padding: 10px 15px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .panel {
      background: rgba(15, 18, 27, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .filters {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 0.8fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    input, select, textarea {
      width: 100%;
      background: #0d121c;
      color: #f3f4f6;
      border: 1px solid #252d3d;
      border-radius: 14px;
      padding: 14px 15px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 130px;
      line-height: 1.5;
    }

    input::placeholder, textarea::placeholder {
      color: #6b7280;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14);
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: #090d14;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1180px;
    }

    th {
      background: #111722;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #222938;
      white-space: nowrap;
    }

    td {
      color: #e5e7eb;
      font-size: 14px;
      padding: 16px;
      border-bottom: 1px solid #1b2230;
      white-space: nowrap;
    }

    tr:hover td { background: #121926; }

    .owner-name {
      font-weight: 700;
      color: #ffffff;
    }

    .remarks {
      color: #cbd5e1;
      max-width: 280px;
      white-space: normal;
      line-height: 1.45;
    }

    .source-badge {
      display: inline-flex;
      background: rgba(59, 130, 246, 0.13);
      border: 1px solid rgba(59, 130, 246, 0.24);
      color: #93c5fd;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-badge {
      display: inline-flex;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.22);
      color: #86efac;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .empty-status {
      color: #6b7280;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .whatsapp {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 10px 24px rgba(34, 197, 94, 0.18);
    }

    .edit {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.18);
    }

    .page-btn { background: #1f2937; }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      color: #9ca3af;
      font-size: 13px;
    }

    .pagination-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .page-info {
      color: #cbd5e1;
      font-weight: 600;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 38px;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      color: #93c5fd;
      padding: 40px;
      font-size: 14px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal {
      width: 480px;
      max-width: 92%;
      background: rgba(17, 22, 32, 0.96);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 30px 90px rgba(0,0,0,0.60);
      transform: translateY(18px) scale(0.96);
      animation: modalIn 0.25s ease forwards;
    }

    @keyframes modalIn {
      to { transform: translateY(0) scale(1); }
    }

    .modal h3 {
      margin: 0 0 6px;
      font-size: 21px;
      font-weight: 700;
    }

    .modal p {
      margin: 0 0 16px;
      color: #8b95a7;
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .cancel-btn { background: #1f2937; }

    .save-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    @media (max-width: 1100px) {
      .filters { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 700px) {
      body { padding: 18px; }

      .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .filters { grid-template-columns: 1fr; }

      .pagination {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<div class="page-header">
  <div class="title-block">
    <h2>Usama Bin Nusrat</h2>
    <p>Owner database · WhatsApp outreach · Remarks tracking</p>
  </div>

  <div class="status-pill">Live CRM Connected</div>
</div>

<div class="panel">
  <div class="filters">
    <input id="searchInput" type="text" placeholder="Search anything...">

    <select id="communityFilter">
      <option value="">Community</option>
    </select>

    <select id="clusterFilter">
      <option value="">Cluster / Tower</option>
    </select>

    <input id="unitFilter" type="text" placeholder="Unit">

    <select id="sourceFilter">
      <option value="">Data Source</option>
    </select>
  </div>

  <div class="table-wrap">
    <table id="dataTable"></table>
  </div>

  <div class="pagination">
    <div id="recordInfo">Loading records...</div>

    <div class="pagination-actions">
      <button class="page-btn" id="prevBtn" onclick="prevPage()">Previous</button>
      <span class="page-info" id="pageInfo">Page 1</span>
      <button class="page-btn" id="nextBtn" onclick="nextPage()">Next</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>Edit Remarks</h3>
    <p>Update owner remarks and save directly to Google Sheets.</p>

    <textarea id="modalRemarks" placeholder="Write remarks here..."></textarea>

    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="save-btn" onclick="saveModalRemarks()">Save Remarks</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://vnydxkmhrcesdffpfjpc.supabase.co";

const SUPABASE_KEY = "sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I";

const HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

let fullData = [];
let filteredData = [];
let activeUnitKey = "";
let currentPage = 1;
const rowsPerPage = 100;

function formatDate(value) {
  if (!value) return "";

  const text = String(value).trim();

  if (!text.includes("T") && isNaN(new Date(text))) {
    return text;
  }

  const date = new Date(text);
  if (isNaN(date)) return text;

  const months = [
    "January","February","March","April",
    "May","June","July","August",
    "September","October","November","December"
  ];

  return `${months[date.getMonth()]}-${date.getFullYear()}`;
}

function getFirstName(name) {
  return name ? String(name).trim().split(" ")[0] : "";
}

function escapeText(text) {
  return String(text || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, "&quot;")
    .replace(/\n/g, "\\n");
}

function makeUnitKey(row) {
  return `${row.community}|${row.cluster}|${row.unit}`.toLowerCase();
}

function showLoading() {
  document.getElementById("dataTable").innerHTML = `
    <tr>
      <td class="loading">Loading records...</td>
    </tr>
  `;
}

async function loadData(useCache = true) {
  showLoading();

  const cached = localStorage.getItem("crmData");

  if (useCache && cached) {
    fullData = JSON.parse(cached);
    prepareData(false);
  }

  try {
    const res = await fetch(API_URL + "?action=getDatabase");
    const freshData = await res.json();

    fullData = freshData;
    localStorage.setItem("crmData", JSON.stringify(freshData));

    prepareData(false);

  } catch (err) {
    console.log("Using cached data only");
  }
}

function prepareData(resetPage = true) {
  fullData = fullData.filter(row => row.community || row.cluster || row.unit || row.owner);

  fullData.sort((a, b) => {
    if (String(a.community) !== String(b.community)) return String(a.community).localeCompare(String(b.community));
    if (String(a.cluster) !== String(b.cluster)) return String(a.cluster).localeCompare(String(b.cluster));
    return Number(a.unit) - Number(b.unit);
  });

  populateFilters();
  applyFilters(resetPage);
}

function populateFilters() {
  addOptions("communityFilter", [...new Set(fullData.map(row => row.community).filter(Boolean))]);
  addOptions("clusterFilter", [...new Set(fullData.map(row => row.cluster).filter(Boolean))]);

  const formattedSources = [...new Set(
    fullData
      .map(row => row.dataSource)
      .filter(Boolean)
      .map(source => formatDate(source))
  )];

  addOptions("sourceFilter", formattedSources);
}

function addOptions(id, values) {
  const select = document.getElementById(id);
  const selectedValue = select.value;
  const firstOption = select.options[0].outerHTML;

  select.innerHTML = firstOption;

  values.sort().forEach(value => {
    select.innerHTML += `<option value="${value}">${value}</option>`;
  });

  select.value = selectedValue;
}

function renderTable() {
  const table = document.getElementById("dataTable");

  table.innerHTML = `
    <tr>
      <th>Community</th>
      <th>Cluster/Tower</th>
      <th>Unit</th>
      <th>Owner</th>
      <th>Phone</th>
      <th>Email</th>
      <th>Remarks</th>
      <th>Action</th>
      <th>Data Source</th>
      <th>WhatsApp</th>
    </tr>
  `;

  if (!filteredData.length) {
    table.innerHTML += `
      <tr>
        <td colspan="10" class="empty">No matching records found</td>
      </tr>
    `;
    updatePagination();
    return;
  }

  const start = (currentPage - 1) * rowsPerPage;
  const end = start + rowsPerPage;
  const pageRows = filteredData.slice(start, end);

  pageRows.forEach(row => {
    const phone = String(row.phone1 || "").replace(/\D/g, "");
    const unitKey = makeUnitKey(row);

    const statusHtml = row.whatsappStatus
      ? `<span class="status-badge">${row.whatsappStatus}</span>`
      : `<span class="empty-status">Not Sent</span>`;

    table.innerHTML += `
      <tr>
        <td>${row.community || ""}</td>
        <td>${row.cluster || ""}</td>
        <td>${row.unit || ""}</td>
        <td class="owner-name">${row.owner || ""}</td>
        <td>${phone}</td>
        <td>${row.email || ""}</td>
        <td class="remarks">${row.remarks || ""}</td>
        <td>
          <div class="actions">
            <button class="whatsapp" onclick="sendWhatsApp('${unitKey}')">WhatsApp</button>
            <button class="edit" onclick="openEditModal('${unitKey}', '${escapeText(row.remarks)}')">Edit</button>
          </div>
        </td>
        <td><span class="source-badge">${formatDate(row.dataSource)}</span></td>
        <td>${statusHtml}</td>
      </tr>
    `;
  });

  updatePagination();
}

function updatePagination() {
  const totalRecords = filteredData.length;
  const totalPages = Math.max(1, Math.ceil(totalRecords / rowsPerPage));

  if (currentPage > totalPages) currentPage = totalPages;

  const startRecord = totalRecords === 0 ? 0 : ((currentPage - 1) * rowsPerPage) + 1;
  const endRecord = Math.min(currentPage * rowsPerPage, totalRecords);

  document.getElementById("recordInfo").innerText =
    `Showing ${startRecord}-${endRecord} of ${totalRecords} records`;

  document.getElementById("pageInfo").innerText =
    `Page ${currentPage} of ${totalPages}`;

  document.getElementById("prevBtn").disabled = currentPage <= 1;
  document.getElementById("nextBtn").disabled = currentPage >= totalPages;
}

function nextPage() {
  const totalPages = Math.ceil(filteredData.length / rowsPerPage);

  if (currentPage < totalPages) {
    currentPage++;
    renderTable();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    renderTable();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function findRowByKey(unitKey) {
  return fullData.find(row => makeUnitKey(row) === unitKey);
}

function buildWhatsAppMessage(row) {
  const firstName = getFirstName(row.owner);

  return `Hello, Mr. ${firstName}

Hope You're Doing Well.

This is Usama from BFG Properties.

I'm reaching out regarding your property in ${row.cluster || ""} (Unit#${row.unit || ""}), ${row.community || ""}.

Would you consider selling if you receive a strong offer?

Waiting for your kind response.

Regards,
Usama Bin Nusrat.`;
}

async function sendWhatsApp(unitKey) {
  const row = findRowByKey(unitKey);

  if (!row) {
    alert("Record not found");
    return;
  }

  const phone = String(row.phone1 || "").replace(/\D/g, "");

  if (phone.length < 9) {
    alert("Invalid WhatsApp number");
    return;
  }

  const message = buildWhatsAppMessage(row);
  const whatsappLink = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

  window.open(whatsappLink, "_blank");

  row.whatsappStatus = "Sent";
  localStorage.setItem("crmData", JSON.stringify(fullData));
  applyFilters(false);

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateWhatsappStatus",
      unitKey: unitKey
    })
  });
}

function openEditModal(unitKey, remarks) {
  activeUnitKey = unitKey;
  document.getElementById("modalRemarks").value = remarks || "";
  document.getElementById("editModal").classList.add("active");
}

function closeModal() {
  document.getElementById("editModal").classList.remove("active");
  activeUnitKey = "";
}

async function saveModalRemarks() {
  const newRemarks = document.getElementById("modalRemarks").value;

  const row = findRowByKey(activeUnitKey);
  if (row) {
    row.remarks = newRemarks;
  }

  localStorage.setItem("crmData", JSON.stringify(fullData));
  closeModal();
  applyFilters(false);

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateRemarks",
      unitKey: activeUnitKey,
      remarks: newRemarks
    })
  });
}

function applyFilters(resetPage = true) {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const community = document.getElementById("communityFilter").value;
  const cluster = document.getElementById("clusterFilter").value;
  const unit = document.getElementById("unitFilter").value.toLowerCase();
  const source = document.getElementById("sourceFilter").value;

  filteredData = fullData.filter(row => {
    const combined = `
      ${row.community}
      ${row.cluster}
      ${row.unit}
      ${row.owner}
      ${row.phone1}
      ${row.phone2}
      ${row.email}
      ${row.remarks}
      ${formatDate(row.dataSource)}
      ${row.whatsappStatus}
    `.toLowerCase();

    return (
      combined.includes(search) &&
      (!community || row.community === community) &&
      (!cluster || row.cluster === cluster) &&
      (!unit || String(row.unit).toLowerCase().includes(unit)) &&
      (!source || formatDate(row.dataSource) === source)
    );
  });

  if (resetPage) currentPage = 1;

  renderTable();
}

document.getElementById("searchInput").addEventListener("input", () => applyFilters(true));
document.getElementById("communityFilter").addEventListener("change", () => applyFilters(true));
document.getElementById("clusterFilter").addEventListener("change", () => applyFilters(true));
document.getElementById("unitFilter").addEventListener("input", () => applyFilters(true));
document.getElementById("sourceFilter").addEventListener("change", () => applyFilters(true));

document.getElementById("editModal").addEventListener("click", function(e) {
  if (e.target.id === "editModal") closeModal();
});

loadData();
</script>

</body>
</html>
