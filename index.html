<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usama Database</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.18), transparent 35%),
        radial-gradient(circle at top right, rgba(34,197,94,.10), transparent 30%),
        #05070c;
      color: #e5e7eb;
      font-family: Poppins, sans-serif;
      padding: 22px;
    }

    .hidden { display: none !important; }

    .wrap {
      max-width: 1600px;
      margin: auto;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .sub {
      color: #a8b3c7;
      margin: 10px 0 22px;
      font-size: 15px;
      max-width: 600px;
      line-height: 1.5;
    }

    .mainHeader {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }

    .logoutBtn {
      width: auto;
      min-width: 110px;
      padding: 11px 18px;
      background: #111827;
      border: 1px solid rgba(148,163,184,.25);
      color: #fff;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .loginBox {
      max-width: 430px;
      margin: 80px auto;
      background: rgba(3,7,18,.86);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }

    .loginBox input {
      margin-bottom: 12px;
    }

    .loginError {
      color: #f87171;
      margin-top: 12px;
      font-size: 13px;
    }

    .card {
      background: rgba(3,7,18,.84);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 20px 70px rgba(0,0,0,.30);
    }

    .filters {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    input, select, button {
      width: 100%;
      border: 1px solid rgba(148,163,184,.24);
      background: #020617;
      color: #e5e7eb;
      border-radius: 14px;
      padding: 14px 15px;
      font-family: Poppins, sans-serif;
      outline: none;
      font-size: 14px;
    }

    input:focus, select:focus {
      border-color: rgba(37,99,235,.7);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    button {
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #16a34a);
      border: none;
      font-weight: 700;
    }

    .reset {
      margin-bottom: 18px;
      height: 54px;
      font-size: 15px;
    }

    .topInfo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 14px;
      color: #a8b3c7;
      font-size: 14px;
      gap: 12px;
    }

    .loadingBadge {
      display: none;
      background: rgba(37,99,235,.15);
      border: 1px solid rgba(37,99,235,.35);
      color: #bfdbfe;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      margin-left: 8px;
    }

    .loadingBadge.show { display: inline-block; }

    .tablebox {
      overflow: auto;
      border-radius: 18px;
      border: 1px solid rgba(148,163,184,.16);
      min-height: 430px;
      max-height: 70vh;
      background: #020617;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1550px;
    }

    th {
      position: sticky;
      top: 0;
      background: #0b1020;
      color: #d1d5db;
      text-align: left;
      font-size: 13px;
      padding: 15px 16px;
      z-index: 2;
      white-space: nowrap;
      border-bottom: 1px solid rgba(148,163,184,.12);
    }

    td {
      padding: 14px 16px;
      border-top: 1px solid rgba(148,163,184,.08);
      font-size: 13px;
      color: #e5e7eb;
      white-space: nowrap;
      vertical-align: middle;
    }

    tr:hover {
      background: rgba(37,99,235,.08);
    }

    .waBtn {
      display: inline-block;
      padding: 9px 13px;
      border-radius: 12px;
      background: linear-gradient(135deg, #16a34a, #059669);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }

    .remarksInput {
      background: #030712;
      border: 1px solid rgba(148,163,184,.24);
      color: #fff;
      width: 360px;
      min-width: 360px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
    }

    .remarksInput:focus {
      border-color: rgba(37,99,235,.7);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    .mobileCards { display: none; }

    .ownerCard {
      background: #020617;
      border: 1px solid rgba(148,163,184,.16);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .ownerTop {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .ownerName {
      font-weight: 700;
      font-size: 16px;
      line-height: 1.3;
    }

    .unitBadge {
      background: rgba(37,99,235,.18);
      color: #bfdbfe;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .infoLine {
      font-size: 14px;
      color: #e5e7eb;
      margin: 9px 0;
      line-height: 1.35;
    }

    .infoLine span {
      color: #94a3b8;
      font-size: 12px;
      display: block;
      margin-bottom: 3px;
    }

    .ownerCard .waBtn {
      font-size: 14px;
      padding: 10px 14px;
      margin-top: 2px;
    }

    .ownerCard .remarksInput {
      width: 100%;
      min-width: 100%;
      margin-top: 4px;
      white-space: normal;
    }

    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 70px 20px;
      font-size: 15px;
    }

    .skeleton {
      height: 18px;
      width: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, #111827, #1f2937, #111827);
      background-size: 200% 100%;
      animation: shine 1.2s infinite;
    }

    @keyframes shine {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      color: #a8b3c7;
      font-size: 14px;
    }

    .pagerBtns {
      display: flex;
      gap: 10px;
    }

    .pager button {
      width: auto;
      min-width: 120px;
      padding: 12px 17px;
    }

    .pageNumber {
      font-weight: 700;
      color: #e5e7eb;
    }

    @media (max-width: 800px) {
      body {
        padding: 14px;
        background:
          radial-gradient(circle at top left, rgba(37,99,235,.18), transparent 45%),
          #07111f;
      }

      .mainHeader {
        align-items: center;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 25px;
      }

      .sub {
        font-size: 13px;
        margin: 8px 0 0;
      }

      .logoutBtn {
        min-width: unset;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 13px;
      }

      .card {
        padding: 14px;
        border-radius: 18px;
      }

      .filters {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      input, select {
        padding: 12px;
        font-size: 13px;
        border-radius: 13px;
      }

      .reset {
        height: 50px;
        margin-bottom: 15px;
      }

      .topInfo {
        flex-direction: column;
        align-items: flex-start;
        font-size: 13px;
      }

      .tablebox {
        display: none;
      }

      .mobileCards {
        display: block;
      }

      .pager {
        flex-direction: column;
        align-items: stretch;
      }

      .pagerBtns {
        width: 100%;
      }

      .pager button {
        width: 100%;
        min-width: unset;
      }

      .loginBox {
        margin: 50px auto;
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div id="loginView" class="loginBox">
    <h1>Usama Database</h1>
    <div class="sub">Login to access your database.</div>

    <input id="loginEmail" type="email" placeholder="Email" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>

    <div id="loginError" class="loginError"></div>
  </div>

  <div id="appView" class="wrap hidden">
    <div class="mainHeader">
      <div>
        <h1>Usama Database</h1>
        <div class="sub">Fast search database with community, cluster, unit and source filters.</div>
      </div>
      <button class="logoutBtn" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="filters">
        <input id="searchInput" placeholder="Search owner, phone or unit..." />

        <select id="communityFilter">
          <option value="">All Communities</option>
        </select>

        <select id="clusterFilter">
          <option value="">All Clusters / Towers</option>
        </select>

        <input id="unitFilter" placeholder="Unit No." />

        <select id="sourceFilter">
          <option value="">All Data Sources</option>
        </select>
      </div>

      <button class="reset" onclick="resetFilters()">Reset Filters</button>

      <div class="topInfo">
        <div>
          <span id="status">Preparing database...</span>
          <span id="loadingBadge" class="loadingBadge">Loading data...</span>
        </div>
        <div>Showing 50 records per page</div>
      </div>

      <div class="tablebox">
        <table>
          <thead>
            <tr>
              <th>Community</th>
              <th>Cluster / Tower</th>
              <th>Unit</th>
              <th>Owner Name</th>
              <th>Phone / WhatsApp</th>
              <th>Remarks</th>
              <th>Source</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div id="mobileCards" class="mobileCards"></div>

      <div class="pager">
        <div id="pageInfo" class="pageNumber">Page 1</div>

        <div class="pagerBtns">
          <button onclick="prevPage()">Previous</button>
          <button onclick="nextPage()">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vnydxkmhrcesdffpfjpc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I";

    const TABLE_NAME = "owners";
    const PAGE_SIZE = 50;

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPage = 0;
    let totalCount = 0;
    let debounceTimer = null;
    let listenersReady = false;

    const el = id => document.getElementById(id);

    async function checkSession() {
      const { data } = await db.auth.getSession();

      if (data.session) {
        el("loginView").classList.add("hidden");
        el("appView").classList.remove("hidden");
        setupListeners();
        loadDropdowns();
        loadData();
      } else {
        el("loginView").classList.remove("hidden");
        el("appView").classList.add("hidden");
      }
    }

    async function login() {
      el("loginError").textContent = "";

      const email = el("loginEmail").value.trim();
      const password = el("loginPassword").value.trim();

      if (!email || !password) {
        el("loginError").textContent = "Enter email and password.";
        return;
      }

      const { error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        el("loginError").textContent = "Wrong email or password.";
        return;
      }

      checkSession();
    }

    async function logout() {
      await db.auth.signOut();
      location.reload();
    }

    function clean(value) {
      if (value === null || value === undefined || value === "" || value === "EMPTY") return "-";
      return String(value);
    }

    function get(row, keys) {
      for (const key of keys) {
        if (row[key] !== undefined && row[key] !== null && row[key] !== "" && row[key] !== "EMPTY") {
          return row[key];
        }
      }
      return "";
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatPhone(phone) {
      let p = String(phone || "").replace(/[^\d]/g, "");
      if (!p) return "";
      if (p.startsWith("00")) p = p.substring(2);
      if (p.length === 9 && p.startsWith("5")) p = "971" + p;
      if (p.length === 10 && p.startsWith("05")) p = "971" + p.substring(1);
      return p;
    }

    function whatsappButton(row) {
      const phone = get(row, ["phone1", "phone2", "phone", "mobile", "contact"]);
      const formatted = formatPhone(phone);

      if (!formatted) return "-";

      const owner = get(row, ["owner"]);
      const unit = get(row, ["unit"]);
      const cluster = get(row, ["cluster"]);
      const community = get(row, ["community"]);

      const msg = `Hello, Mr. ${owner || ""}

Hope you're doing well.

This is Usama from BFG Properties.

I'm reaching out regarding your property in ${cluster} (Unit ${unit}), ${community}.

Would you consider selling if you receive a strong offer?

Looking forward to your kind response.

Regards,
Usama Bin Nusrat.`;

      return `<a class="waBtn" target="_blank" href="https://wa.me/${formatted}?text=${encodeURIComponent(msg)}">${escapeHtml(phone)}</a>`;
    }

    function showLoading() {
      el("loadingBadge").classList.add("show");
      el("status").textContent = "Loading database, please wait...";

      el("tableBody").innerHTML = Array.from({ length: 8 }).map(() => `
        <tr>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
        </tr>
      `).join("");

      el("mobileCards").innerHTML = Array.from({ length: 4 }).map(() => `
        <div class="ownerCard">
          <div class="skeleton" style="height:22px;margin-bottom:12px;"></div>
          <div class="skeleton" style="margin-bottom:10px;"></div>
          <div class="skeleton" style="margin-bottom:10px;"></div>
          <div class="skeleton"></div>
        </div>
      `).join("");
    }

    function hideLoading() {
      el("loadingBadge").classList.remove("show");
    }

    async function updateRemarks(id, value) {
      const { error } = await db
        .from(TABLE_NAME)
        .update({ remarks: value })
        .eq("id", id);

      if (error) {
        alert("Failed to update remarks");
      }
    }

    async function loadData() {
      showLoading();

      const from = currentPage * PAGE_SIZE;
      const to = from + PAGE_SIZE - 1;

      let query = db
        .from(TABLE_NAME)
        .select("*", { count: "exact" })
        .range(from, to);

      const search = el("searchInput").value.trim();
      const community = el("communityFilter").value;
      const cluster = el("clusterFilter").value;
      const unit = el("unitFilter").value.trim();
      const source = el("sourceFilter").value;

      if (search) {
        query = query.or(`owner.ilike.%${search}%,unit.ilike.%${search}%,phone1.ilike.%${search}%,phone2.ilike.%${search}%`);
      }

      if (community) query = query.eq("community", community);
      if (cluster) query = query.eq("cluster", cluster);
      if (unit) query = query.ilike("unit", `%${unit}%`);
      if (source) query = query.eq("data_source", source);

      query = query
        .order("community", { ascending: true })
        .order("cluster", { ascending: true })
        .order("unit_sort", { ascending: true });

      const { data, error, count } = await query;

      hideLoading();

      if (error) {
        el("status").textContent = "Error loading data";
        el("tableBody").innerHTML = `<tr><td colspan="8" class="empty">Error: ${error.message}</td></tr>`;
        el("mobileCards").innerHTML = `<div class="empty">Error: ${error.message}</div>`;
        return;
      }

      totalCount = count || 0;
      renderData(data || []);

      const start = totalCount === 0 ? 0 : from + 1;
      const end = Math.min(to + 1, totalCount);
      const totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));

      el("status").textContent = `Showing ${start}-${end} of ${totalCount} records`;
      el("pageInfo").textContent = `Page ${currentPage + 1} of ${totalPages}`;
    }

    function renderData(rows) {
      if (!rows.length) {
        el("tableBody").innerHTML = `<tr><td colspan="8" class="empty">No records found</td></tr>`;
        el("mobileCards").innerHTML = `<div class="empty">No records found</div>`;
        return;
      }

      el("tableBody").innerHTML = rows.map(row => {
        const remarks = get(row, ["remarks"]);
        const email = get(row, ["email"]);
        const source = get(row, ["data_source"]);

        return `
          <tr>
            <td>${escapeHtml(clean(row.community))}</td>
            <td>${escapeHtml(clean(row.cluster))}</td>
            <td>${escapeHtml(clean(row.unit))}</td>
            <td>${escapeHtml(clean(row.owner))}</td>
            <td>${whatsappButton(row)}</td>
            <td>
              <input 
                class="remarksInput"
                value="${escapeHtml(remarks)}"
                placeholder="Add remarks..."
                onblur="updateRemarks(${row.id}, this.value)"
              />
            </td>
            <td>${escapeHtml(clean(source))}</td>
            <td>${escapeHtml(clean(email))}</td>
          </tr>
        `;
      }).join("");

      el("mobileCards").innerHTML = rows.map(row => {
        const remarks = get(row, ["remarks"]);
        const email = get(row, ["email"]);
        const source = get(row, ["data_source"]);

        return `
          <div class="ownerCard">
            <div class="ownerTop">
              <div class="ownerName">${escapeHtml(clean(row.owner))}</div>
              <div class="unitBadge">Unit ${escapeHtml(clean(row.unit))}</div>
            </div>

            <div class="infoLine"><span>Community</span>${escapeHtml(clean(row.community))}</div>
            <div class="infoLine"><span>Cluster / Tower</span>${escapeHtml(clean(row.cluster))}</div>
            <div class="infoLine"><span>WhatsApp</span>${whatsappButton(row)}</div>

            <div class="infoLine">
              <span>Remarks</span>
              <input 
                class="remarksInput"
                value="${escapeHtml(remarks)}"
                placeholder="Add remarks..."
                onblur="updateRemarks(${row.id}, this.value)"
              />
            </div>

            <div class="infoLine"><span>Source</span>${escapeHtml(clean(source))}</div>
            <div class="infoLine"><span>Email</span>${escapeHtml(clean(email))}</div>
          </div>
        `;
      }).join("");
    }

    async function loadDropdowns() {
      let allRows = [];
      let from = 0;
      const batchSize = 1000;

      while (true) {
        const { data, error } = await db
          .from(TABLE_NAME)
          .select("community, cluster, data_source")
          .range(from, from + batchSize - 1);

        if (error || !data || data.length === 0) break;

        allRows = allRows.concat(data);

        if (data.length < batchSize) break;
        from += batchSize;
      }

      fillSelect("communityFilter", [...new Set(allRows.map(x => x.community).filter(Boolean))]);
      fillSelect("clusterFilter", [...new Set(allRows.map(x => x.cluster).filter(Boolean))]);
      fillSelect("sourceFilter", [...new Set(allRows.map(x => x.data_source).filter(Boolean))]);
    }

    function fillSelect(id, values) {
      const select = el(id);
      const firstOption = select.children[0].outerHTML;

      select.innerHTML = firstOption + values
        .sort((a, b) => String(a).localeCompare(String(b)))
        .map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`)
        .join("");
    }

    function resetFilters() {
      el("searchInput").value = "";
      el("communityFilter").value = "";
      el("clusterFilter").value = "";
      el("unitFilter").value = "";
      el("sourceFilter").value = "";

      currentPage = 0;
      loadData();
    }

    function nextPage() {
      if ((currentPage + 1) * PAGE_SIZE >= totalCount) return;
      currentPage++;
      loadData();
    }

    function prevPage() {
      if (currentPage === 0) return;
      currentPage--;
      loadData();
    }

    function setupListeners() {
      if (listenersReady) return;
      listenersReady = true;

      ["searchInput", "unitFilter"].forEach(id => {
        el(id).addEventListener("input", () => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            currentPage = 0;
            loadData();
          }, 400);
        });
      });

      ["communityFilter", "clusterFilter", "sourceFilter"].forEach(id => {
        el(id).addEventListener("change", () => {
          currentPage = 0;
          loadData();
        });
      });
    }

    checkSession();
  </script>
</body>
</html>
