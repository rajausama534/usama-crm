<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usama Bin Nusrat</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.18), transparent 35%),
        radial-gradient(circle at top right, rgba(34,197,94,.10), transparent 30%),
        #05070c;
      color: #e5e7eb;
      font-family: Poppins, sans-serif;
      padding: 24px;
    }

    .wrap { max-width: 1500px; margin: auto; }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
    }

    .sub {
      color: #9ca3af;
      margin: 10px 0 28px;
      font-size: 15px;
    }

    .card {
      background: rgba(3,7,18,.82);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 18px;
      padding: 20px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    input, select, button {
      width: 100%;
      border: 1px solid rgba(148,163,184,.22);
      background: #020617;
      color: #e5e7eb;
      border-radius: 12px;
      padding: 13px 14px;
      font-family: Poppins, sans-serif;
      outline: none;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #16a34a);
      border: none;
      font-weight: 600;
    }

    .reset {
      margin-bottom: 18px;
      height: 52px;
      font-size: 15px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 14px;
      color: #a8b3c7;
      font-size: 14px;
      gap: 12px;
    }

    .loadingBadge {
      display: none;
      background: rgba(37,99,235,.15);
      border: 1px solid rgba(37,99,235,.35);
      color: #bfdbfe;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
    }

    .loadingBadge.show {
      display: inline-block;
    }

    .tablebox {
      overflow: auto;
      border-radius: 14px;
      border: 1px solid rgba(148,163,184,.14);
      min-height: 360px;
      max-height: 68vh;
      background: #020617;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1300px;
    }

    th {
      position: sticky;
      top: 0;
      background: #0b1020;
      color: #d1d5db;
      text-align: left;
      font-size: 13px;
      padding: 14px;
      z-index: 2;
      white-space: nowrap;
    }

    td {
      padding: 13px 14px;
      border-top: 1px solid rgba(148,163,184,.10);
      font-size: 13px;
      color: #e5e7eb;
      white-space: nowrap;
    }

    tr:hover { background: rgba(37,99,235,.08); }

    .empty, .loadingRow {
      text-align: center;
      color: #94a3b8;
      padding: 70px 20px;
      font-size: 15px;
    }

    .skeleton {
      height: 18px;
      width: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, #111827, #1f2937, #111827);
      background-size: 200% 100%;
      animation: shine 1.2s infinite;
    }

    @keyframes shine {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      color: #a8b3c7;
      font-size: 14px;
    }

    .pagerBtns {
      display: flex;
      gap: 10px;
    }

    .pager button {
      width: auto;
      min-width: 115px;
      padding: 11px 16px;
    }

    .pageNumber {
      font-weight: 600;
      color: #e5e7eb;
    }

    @media (max-width: 900px) {
      body { padding: 14px; }
      .filters { grid-template-columns: 1fr; }
      .pager { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Owner Database</h1>
    <div class="sub">Fast search database with community, cluster, unit and source filters.</div>

    <div class="card">
      <div class="filters">
        <input id="searchInput" placeholder="Search owner or unit..." />

        <select id="communityFilter">
          <option value="">All Communities</option>
        </select>

        <select id="clusterFilter">
          <option value="">All Clusters / Towers</option>
        </select>

        <input id="unitFilter" placeholder="Unit No." />

        <select id="sourceFilter">
          <option value="">All Data Sources</option>
        </select>
      </div>

      <button class="reset" onclick="resetFilters()">Reset Filters</button>

      <div class="topbar">
        <div>
          <span id="status">Preparing database...</span>
          <span id="loadingBadge" class="loadingBadge">Loading data...</span>
        </div>
        <div>Showing 50 records per page</div>
      </div>

      <div class="tablebox">
        <table>
          <thead>
            <tr>
              <th>Community</th>
              <th>Cluster / Tower</th>
              <th>Unit</th>
              <th>Owner Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Remarks</th>
              <th>WhatsApp Status</th>
              <th>Source</th>
            </tr>
          </thead>

          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="pager">
        <div id="pageInfo" class="pageNumber">Page 1</div>

        <div class="pagerBtns">
          <button onclick="prevPage()">Previous</button>
          <button onclick="nextPage()">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vnydxkmhrcesdffpfjpc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I";

    const TABLE_NAME = "owners";
    const PAGE_SIZE = 50;

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPage = 0;
    let totalCount = 0;
    let debounceTimer = null;

    const el = id => document.getElementById(id);

    function clean(value) {
      if (value === null || value === undefined || value === "") return "-";
      return String(value);
    }

    function showLoading() {
      el("loadingBadge").classList.add("show");
      el("status").textContent = "Loading database, please wait...";
      el("tableBody").innerHTML = Array.from({ length: 8 }).map(() => `
        <tr>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
          <td><div class="skeleton"></div></td>
        </tr>
      `).join("");
    }

    function hideLoading() {
      el("loadingBadge").classList.remove("show");
    }

    async function loadData() {
      showLoading();

      const from = currentPage * PAGE_SIZE;
      const to = from + PAGE_SIZE - 1;

      let query = db
        .from(TABLE_NAME)
        .select("*", { count: "exact" })
        .range(from, to);

      const search = el("searchInput").value.trim();
      const community = el("communityFilter").value;
      const cluster = el("clusterFilter").value;
      const unit = el("unitFilter").value.trim();
      const source = el("sourceFilter").value;

      if (search) {
        query = query.or(`owner.ilike.%${search}%,unit.ilike.%${search}%`);
      }

      if (community) query = query.eq("community", community);
      if (cluster) query = query.eq("cluster", cluster);
      if (unit) query = query.ilike("unit", `%${unit}%`);

      if (source) {
        query = query.eq("data_source", source);
      }

      query = query
        .order("community", { ascending: true })
        .order("cluster", { ascending: true })
        .order("unit", { ascending: true });

      const { data, error, count } = await query;

      hideLoading();

      if (error) {
        el("status").textContent = "Error loading data";
        el("tableBody").innerHTML = `
          <tr>
            <td colspan="9" class="empty">Error: ${error.message}</td>
          </tr>
        `;
        return;
      }

      totalCount = count || 0;
      renderTable(data || []);

      const start = totalCount === 0 ? 0 : from + 1;
      const end = Math.min(to + 1, totalCount);
      const totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));

      el("status").textContent = `Showing ${start}-${end} of ${totalCount} records`;
      el("pageInfo").textContent = `Page ${currentPage + 1} of ${totalPages}`;
    }

    function renderTable(rows) {
      if (!rows.length) {
        el("tableBody").innerHTML = `
          <tr>
            <td colspan="9" class="empty">No records found</td>
          </tr>
        `;
        return;
      }

      el("tableBody").innerHTML = rows.map(row => `
        <tr>
          <td>${clean(row.community)}</td>
          <td>${clean(row.cluster)}</td>
          <td>${clean(row.unit)}</td>
          <td>${clean(row.owner)}</td>
          <td>${clean(row.phone)}</td>
          <td>${clean(row.email)}</td>
          <td>${clean(row.remarks)}</td>
          <td>${clean(row.whatsapp_status)}</td>
          <td>${clean(row.data_source)}</td>
        </tr>
      `).join("");
    }

    async function loadDropdowns() {
      const { data, error } = await db
        .from(TABLE_NAME)
        .select("*")
        .limit(5000);

      if (error || !data) return;

      fillSelect("communityFilter", [...new Set(data.map(x => x.community).filter(Boolean))]);
      fillSelect("clusterFilter", [...new Set(data.map(x => x.cluster).filter(Boolean))]);
      fillSelect("sourceFilter", [...new Set(data.map(x => x.data_source).filter(Boolean))]);
    }

    function fillSelect(id, values) {
      const select = el(id);
      const firstOption = select.children[0].outerHTML;

      select.innerHTML = firstOption + values
        .sort((a, b) => String(a).localeCompare(String(b)))
        .map(v => `<option value="${v}">${v}</option>`)
        .join("");
    }

    function resetFilters() {
      el("searchInput").value = "";
      el("communityFilter").value = "";
      el("clusterFilter").value = "";
      el("unitFilter").value = "";
      el("sourceFilter").value = "";

      currentPage = 0;
      loadData();
    }

    function nextPage() {
      if ((currentPage + 1) * PAGE_SIZE >= totalCount) return;
      currentPage++;
      loadData();
    }

    function prevPage() {
      if (currentPage === 0) return;
      currentPage--;
      loadData();
    }

    function setupListeners() {
      ["searchInput", "unitFilter"].forEach(id => {
        el(id).addEventListener("input", () => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            currentPage = 0;
            loadData();
          }, 400);
        });
      });

      ["communityFilter", "clusterFilter", "sourceFilter"].forEach(id => {
        el(id).addEventListener("change", () => {
          currentPage = 0;
          loadData();
        });
      });
    }

    setupListeners();
    loadDropdowns();
    loadData();
  </script>
</body>
</html>
