<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usama Bin Nusrat</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.18), transparent 35%),
        radial-gradient(circle at top right, rgba(34,197,94,.10), transparent 30%),
        #080b10;
      color: #e5e7eb;
      font-family: Poppins, sans-serif;
      padding: 24px;
    }

    .wrap { max-width: 1400px; margin: auto; }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 700;
    }

    .sub {
      color: #9ca3af;
      margin-bottom: 22px;
      font-size: 14px;
    }

    .card {
      background: rgba(15,23,42,.78);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }

    .filters {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    input, select, button {
      width: 100%;
      border: 1px solid rgba(148,163,184,.22);
      background: #0b1220;
      color: #e5e7eb;
      border-radius: 12px;
      padding: 12px 13px;
      font-family: Poppins, sans-serif;
      outline: none;
      font-size: 13px;
    }

    button {
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #16a34a);
      border: none;
      font-weight: 600;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0;
      color: #9ca3af;
      font-size: 13px;
      gap: 10px;
    }

    .tablebox {
      overflow: auto;
      border-radius: 14px;
      border: 1px solid rgba(148,163,184,.14);
      max-height: 68vh;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
      background: rgba(2,6,23,.35);
    }

    th {
      position: sticky;
      top: 0;
      background: #111827;
      color: #cbd5e1;
      text-align: left;
      font-size: 12px;
      padding: 13px;
      z-index: 1;
      white-space: nowrap;
    }

    td {
      padding: 12px 13px;
      border-top: 1px solid rgba(148,163,184,.10);
      font-size: 13px;
      color: #e5e7eb;
      vertical-align: top;
      white-space: nowrap;
    }

    tr:hover { background: rgba(37,99,235,.08); }

    .muted { color: #94a3b8; }

    .pager {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .pager button {
      width: auto;
      min-width: 110px;
      padding: 10px 14px;
    }

    .empty, .loading {
      padding: 30px;
      text-align: center;
      color: #94a3b8;
    }

    @media (max-width: 900px) {
      body { padding: 14px; }
      .filters { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Owner Database</h1>
    <div class="sub">Fast search database with community, cluster, unit and source filters.</div>

    <div class="card">
      <div class="filters">
        <input id="searchInput" placeholder="Search owner, phone, unit, email..." />
        <select id="communityFilter">
          <option value="">All Communities</option>
        </select>
        <select id="clusterFilter">
          <option value="">All Clusters / Towers</option>
        </select>
        <input id="unitFilter" placeholder="Unit No." />
        <select id="sourceFilter">
          <option value="">All Data Sources</option>
        </select>
      </div>

      <button onclick="resetFilters()">Reset Filters</button>

      <div class="topbar">
        <div id="status">Loading...</div>
        <div class="muted">Showing 50 records per page</div>
      </div>

      <div class="tablebox">
        <table>
          <thead>
            <tr>
              <th>Community</th>
              <th>Cluster / Tower</th>
              <th>Unit</th>
              <th>Owner Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Remarks</th>
              <th>Data Source</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8" class="loading">Loading data...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pager">
        <button onclick="prevPage()">Previous</button>
        <button onclick="nextPage()">Next</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vnydxkmhrcesdffpfjpc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I";

    const TABLE_NAME = "owners"; 
    const PAGE_SIZE = 50;

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPage = 0;
    let totalCount = 0;
    let debounceTimer;

    const el = id => document.getElementById(id);

    function clean(value) {
      if (value === null || value === undefined || value === "") return "-";
      return String(value);
    }

    function get(row, keys) {
      for (const key of keys) {
        if (row[key] !== undefined && row[key] !== null && row[key] !== "") return row[key];
      }
      return "";
    }

    function mapRow(row) {
      return {
        community: get(row, ["community", "Community"]),
        cluster: get(row, ["cluster", "cluster_tower", "tower", "Cluster", "Cluster/Tower"]),
        unit: get(row, ["unit", "unit_number", "unit_no", "Unit", "Unit No"]),
        owner: get(row, ["owner_name", "owner", "name", "Owner Name"]),
        phone: get(row, ["phone", "mobile", "contact", "Phone", "Mobile"]),
        email: get(row, ["email", "Email"]),
        remarks: get(row, ["remarks", "note", "Remarks"]),
        source: get(row, ["data_source", "source", "Data Source"])
      };
    }

    async function loadData() {
      el("tableBody").innerHTML = `<tr><td colspan="8" class="loading">Loading data...</td></tr>`;
      el("status").textContent = "Loading...";

      const from = currentPage * PAGE_SIZE;
      const to = from + PAGE_SIZE - 1;

      let query = db
        .from(TABLE_NAME)
        .select("*", { count: "exact" })
        .range(from, to);

      const search = el("searchInput").value.trim();
      const community = el("communityFilter").value;
      const cluster = el("clusterFilter").value;
      const unit = el("unitFilter").value.trim();
      const source = el("sourceFilter").value;

      if (search) {
        query = query.or(
          `owner_name.ilike.%${search}%,phone.ilike.%${search}%,email.ilike.%${search}%,unit_number.ilike.%${search}%`
        );
      }

      if (community) query = query.eq("community", community);
      if (cluster) query = query.eq("cluster", cluster);
      if (unit) query = query.ilike("unit_number", `%${unit}%`);
      if (source) query = query.eq("data_source", source);

      query = query.order("community", { ascending: true })
                   .order("cluster", { ascending: true })
                   .order("unit_number", { ascending: true });

      const { data, error, count } = await query;

      if (error) {
        el("tableBody").innerHTML = `<tr><td colspan="8" class="empty">Error: ${error.message}</td></tr>`;
        el("status").textContent = "Error loading data";
        return;
      }

      totalCount = count || 0;
      renderTable(data || []);

      const start = totalCount === 0 ? 0 : from + 1;
      const end = Math.min(to + 1, totalCount);
      el("status").textContent = `Showing ${start}-${end} of ${totalCount} records`;
    }

    function renderTable(rows) {
      if (!rows.length) {
        el("tableBody").innerHTML = `<tr><td colspan="8" class="empty">No records found</td></tr>`;
        return;
      }

      el("tableBody").innerHTML = rows.map(row => {
        const r = mapRow(row);
        return `
          <tr>
            <td>${clean(r.community)}</td>
            <td>${clean(r.cluster)}</td>
            <td>${clean(r.unit)}</td>
            <td>${clean(r.owner)}</td>
            <td>${clean(r.phone)}</td>
            <td>${clean(r.email)}</td>
            <td>${clean(r.remarks)}</td>
            <td>${clean(r.source)}</td>
          </tr>
        `;
      }).join("");
    }

    async function loadDropdowns() {
      const { data, error } = await db.from(TABLE_NAME).select("community, cluster, data_source");

      if (error || !data) return;

      fillSelect("communityFilter", [...new Set(data.map(x => x.community).filter(Boolean))]);
      fillSelect("clusterFilter", [...new Set(data.map(x => x.cluster).filter(Boolean))]);
      fillSelect("sourceFilter", [...new Set(data.map(x => x.data_source).filter(Boolean))]);
    }

    function fillSelect(id, values) {
      const select = el(id);
      const first = select.children[0].outerHTML;

      select.innerHTML = first + values
        .sort((a, b) => String(a).localeCompare(String(b)))
        .map(v => `<option value="${v}">${v}</option>`)
        .join("");
    }

    function resetFilters() {
      el("searchInput").value = "";
      el("communityFilter").value = "";
      el("clusterFilter").value = "";
      el("unitFilter").value = "";
      el("sourceFilter").value = "";
      currentPage = 0;
      loadData();
    }

    function nextPage() {
      if ((currentPage + 1) * PAGE_SIZE >= totalCount) return;
      currentPage++;
      loadData();
    }

    function prevPage() {
      if (currentPage === 0) return;
      currentPage--;
      loadData();
    }

    function setupListeners() {
      ["searchInput", "unitFilter"].forEach(id => {
        el(id).addEventListener("input", () => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            currentPage = 0;
            loadData();
          }, 400);
        });
      });

      ["communityFilter", "clusterFilter", "sourceFilter"].forEach(id => {
        el(id).addEventListener("change", () => {
          currentPage = 0;
          loadData();
        });
      });
    }

    setupListeners();
    loadDropdowns();
    loadData();
  </script>
</body>
</html>
