<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Usama Bin Nusrat Database</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#0b1120;
  color:white;
}

.hidden{
  display:none !important;
}

header{
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(15,23,42,.95);
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;
  top:0;
  z-index:100;
}

header h1{
  font-size:22px;
  font-weight:600;
}

.container{
  padding:20px;
}

button{
  border:none;
  outline:none;
  cursor:pointer;
  border-radius:10px;
  padding:10px 16px;
  font-weight:600;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
}

.primary{
  background:#2563eb;
  color:white;
}

.green{
  background:#16a34a;
  color:white;
}

.red{
  background:#dc2626;
  color:white;
}

.gray{
  background:#475569;
  color:white;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  background:#111827;
  color:white;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
}

.login-box{
  width:100%;
  max-width:400px;
  margin:100px auto;
  background:rgba(17,24,39,.95);
  border:1px solid rgba(255,255,255,.08);
  padding:24px;
  border-radius:20px;
}

.login-box h2{
  margin-bottom:20px;
}

.filters{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-bottom:20px;
}

.table-wrapper{
  overflow:auto;
  border-radius:18px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#111827;
}

th{
  background:#1e293b;
  padding:14px;
  text-align:left;
  font-size:13px;
  white-space:nowrap;
}

td{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.06);
  font-size:13px;
  white-space:nowrap;
}

tr:hover{
  background:#182234;
}

.status{
  padding:6px 10px;
  border-radius:30px;
  font-size:11px;
  font-weight:600;
}

.sale{
  background:#15803d;
}

.rent{
  background:#65a30d;
  color:black;
}

.sold{
  background:#dc2626;
}

.other{
  background:#475569;
}

.action-buttons{
  display:flex;
  gap:8px;
}

.whatsapp-btn{
  background:#16a34a;
}

.pagination{
  margin-top:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:1000;
}

.modal-content{
  width:100%;
  max-width:600px;
  background:#111827;
  border-radius:20px;
  padding:24px;
}

.modal-content h3{
  margin-bottom:15px;
}

@media(max-width:768px){

  .table-wrapper{
    display:none;
  }

  .mobile-cards{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .card{
    background:#111827;
    border-radius:18px;
    padding:16px;
    border:1px solid rgba(255,255,255,.06);
  }

  .card h3{
    margin-bottom:8px;
  }

  .desktop-only{
    display:none;
  }
}

@media(min-width:769px){
  .mobile-cards{
    display:none;
  }
}

</style>
</head>

<body>

<div id="loginPage">

  <div class="login-box">

    <h2>Login</h2>

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <button class="primary" style="width:100%;margin-top:10px;" onclick="login()">
      Login
    </button>

  </div>

</div>

<div id="appPage" class="hidden">

<header>

  <h1>Usama Bin Nusrat Database</h1>

  <div style="display:flex;gap:10px;">

    <button class="green" onclick="openAddModal()">
      Add Owner
    </button>

    <button class="red" onclick="logout()">
      Logout
    </button>

  </div>

</header>

<div class="container">

<div class="filters">

<input type="text" id="searchInput" placeholder="Search..." onkeyup="filterData()">

<select id="statusFilter" onchange="filterData()">
<option value="">All Status</option>
<option>For Sale</option>
<option>For Rent</option>
<option>Sold</option>
<option>No Response</option>
<option>Call Back</option>
<option>Not Interested</option>
</select>

<select id="communityFilter" onchange="filterData()">
<option value="">All Communities</option>
</select>

</div>

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Community</th>
<th>Cluster</th>
<th>Unit</th>
<th>Owner</th>
<th>Phone</th>
<th>Status</th>
<th>Remarks</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<div class="mobile-cards" id="mobileCards"></div>

<div class="pagination">

<button class="gray" onclick="prevPage()">Previous</button>

<span id="pageInfo">1</span>

<button class="gray" onclick="nextPage()">Next</button>

</div>

</div>

</div>

<div class="modal hidden" id="ownerModal">

<div class="modal-content">

<h3 id="modalTitle">Add Owner</h3>

<input type="hidden" id="ownerId">

<input id="community" placeholder="Community">

<input id="cluster" placeholder="Cluster">

<input id="unit" placeholder="Unit">

<input id="ownerName" placeholder="Owner Name">

<input id="phone" placeholder="Phone">

<select id="status">
<option>For Sale</option>
<option>For Rent</option>
<option>Sold</option>
<option>No Response</option>
<option>Call Back</option>
<option>Not Interested</option>
</select>

<textarea id="remarks" placeholder="Remarks"></textarea>

<div style="display:flex;gap:10px;margin-top:15px;">

<button class="primary" onclick="saveOwner()">
Save
</button>

<button class="gray" onclick="closeModal()">
Cancel
</button>

</div>

</div>

</div>

<script>

const supabaseUrl = 'https://vnydxkmhrcesdffpfjpc.supabase.co';

const supabaseKey = 'sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I';

const supabase = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);

let allData = [];
let filteredData = [];

let currentPage = 1;
const rowsPerPage = 100;

async function login(){

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert(error.message);
    return;
  }

  initApp();
}

async function logout(){

  await supabase.auth.signOut();
  location.reload();
}

async function initApp(){

  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');

  loadOwners();
}

async function loadOwners(){

  const { data, error } = await supabase
    .from('owners')
    .select('*')
    .order('created_at',{ascending:false});

  if(error){
    console.log(error);
    return;
  }

  allData = data || [];
  filteredData = [...allData];

  populateCommunities();

  renderData();
}

function populateCommunities(){

  const filter = document.getElementById('communityFilter');

  const unique = [...new Set(allData.map(i => i.community).filter(Boolean))];

  unique.forEach(c => {

    const opt = document.createElement('option');
    opt.value = c;
    opt.innerText = c;

    filter.appendChild(opt);

  });

}

function filterData(){

  const search = document.getElementById('searchInput').value.toLowerCase();

  const status = document.getElementById('statusFilter').value;

  const community = document.getElementById('communityFilter').value;

  filteredData = allData.filter(item => {

    const text = `
      ${item.community || ''}
      ${item.cluster || ''}
      ${item.unit || ''}
      ${item.owner_name || ''}
      ${item.phone || ''}
      ${item.remarks || ''}
    `.toLowerCase();

    const matchSearch = text.includes(search);

    const matchStatus = !status || item.status === status;

    const matchCommunity = !community || item.community === community;

    return matchSearch && matchStatus && matchCommunity;

  });

  currentPage = 1;

  renderData();
}

function renderData(){

  const tbody = document.getElementById('tableBody');

  const mobile = document.getElementById('mobileCards');

  tbody.innerHTML = '';
  mobile.innerHTML = '';

  const start = (currentPage - 1) * rowsPerPage;
  const end = start + rowsPerPage;

  const pageData = filteredData.slice(start,end);

  pageData.forEach(item => {

    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>${item.community || ''}</td>
      <td>${item.cluster || ''}</td>
      <td>${item.unit || ''}</td>
      <td>${item.owner_name || ''}</td>
      <td>${item.phone || ''}</td>
      <td>${statusBadge(item.status)}</td>
      <td>${item.remarks || ''}</td>
      <td>
        <div class="action-buttons">
          <button class="primary" onclick='editOwner(${JSON.stringify(item)})'>Edit</button>
          <button class="whatsapp-btn" onclick='sendWhatsApp(${JSON.stringify(item)})'>WA</button>
        </div>
      </td>
    `;

    tbody.appendChild(tr);

    const card = document.createElement('div');

    card.className = 'card';

    card.innerHTML = `
      <h3>${item.owner_name || ''}</h3>
      <p><b>Community:</b> ${item.community || ''}</p>
      <p><b>Cluster:</b> ${item.cluster || ''}</p>
      <p><b>Unit:</b> ${item.unit || ''}</p>
      <p><b>Phone:</b> ${item.phone || ''}</p>
      <p>${statusBadge(item.status)}</p>

      <div style="display:flex;gap:10px;margin-top:10px;">
        <button class="primary" onclick='editOwner(${JSON.stringify(item)})'>Edit</button>
        <button class="whatsapp-btn" onclick='sendWhatsApp(${JSON.stringify(item)})'>WA</button>
      </div>
    `;

    mobile.appendChild(card);

  });

  const totalPages = Math.ceil(filteredData.length / rowsPerPage);

  document.getElementById('pageInfo').innerText =
    `${currentPage} / ${totalPages || 1}`;
}

function statusBadge(status){

  let cls = 'other';

  if(status === 'For Sale') cls = 'sale';
  if(status === 'For Rent') cls = 'rent';
  if(status === 'Sold') cls = 'sold';

  return `<span class="status ${cls}">${status || '-'}</span>`;
}

function nextPage(){

  const totalPages = Math.ceil(filteredData.length / rowsPerPage);

  if(currentPage < totalPages){

    currentPage++;
    renderData();

  }
}

function prevPage(){

  if(currentPage > 1){

    currentPage--;
    renderData();

  }
}

function openAddModal(){

  document.getElementById('modalTitle').innerText = 'Add Owner';

  document.getElementById('ownerId').value = '';

  clearModal();

  document.getElementById('ownerModal').classList.remove('hidden');
}

function closeModal(){

  document.getElementById('ownerModal').classList.add('hidden');
}

function clearModal(){

  document.getElementById('community').value = '';
  document.getElementById('cluster').value = '';
  document.getElementById('unit').value = '';
  document.getElementById('ownerName').value = '';
  document.getElementById('phone').value = '';
  document.getElementById('remarks').value = '';
}

function editOwner(item){

  document.getElementById('modalTitle').innerText = 'Edit Owner';

  document.getElementById('ownerId').value = item.id;

  document.getElementById('community').value = item.community || '';
  document.getElementById('cluster').value = item.cluster || '';
  document.getElementById('unit').value = item.unit || '';
  document.getElementById('ownerName').value = item.owner_name || '';
  document.getElementById('phone').value = item.phone || '';
  document.getElementById('status').value = item.status || '';
  document.getElementById('remarks').value = item.remarks || '';

  document.getElementById('ownerModal').classList.remove('hidden');
}

async function saveOwner(){

  const id = document.getElementById('ownerId').value;

  const payload = {

    community:document.getElementById('community').value,
    cluster:document.getElementById('cluster').value,
    unit:document.getElementById('unit').value,
    owner_name:document.getElementById('ownerName').value,
    phone:document.getElementById('phone').value,
    status:document.getElementById('status').value,
    remarks:document.getElementById('remarks').value

  };

  let response;

  if(id){

    response = await supabase
      .from('owners')
      .update(payload)
      .eq('id',id);

  }else{

    response = await supabase
      .from('owners')
      .insert([payload]);

  }

  if(response.error){

    alert(response.error.message);
    return;

  }

  closeModal();

  loadOwners();
}

function sendWhatsApp(item){

  const firstName = (item.owner_name || '').split(' ')[0];

  const msg = `
Hello Mr. ${firstName}

Hope you're doing well.

This is Usama from BFG Properties.

I’m reaching out regarding your property in ${item.cluster || ''} (Unit #${item.unit || ''}), ${item.community || ''}.

Would you consider selling if you receive a strong offer?

Waiting for your kind response.

Regards,
Usama Bin Nusrat
`;

  window.open(
    `https://wa.me/${item.phone}?text=${encodeURIComponent(msg)}`,
    '_blank'
  );
}

async function checkUser(){

  const { data } = await supabase.auth.getSession();

  if(data.session){

    initApp();

  }
}

checkUser();

</script>

</body>
</html>
