<!DOCTYPE html>
<html>
<head>
  <title>Usama Bin Nusrat</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 35%),
        radial-gradient(circle at top right, rgba(34, 197, 94, 0.10), transparent 30%),
        #080b10;
      color: #e5e7eb;
      font-family: 'Poppins', sans-serif;
      padding: 28px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
    }

    .title-block h2 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .title-block p {
      margin: 6px 0 0;
      color: #8b95a7;
      font-size: 13px;
    }

    .status-pill {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #86efac;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
    }

    .panel {
      background: rgba(15, 18, 27, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
    }

    .filters {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 0.8fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    input, select, textarea {
      width: 100%;
      background: #10151f;
      color: #f3f4f6;
      border: 1px solid #242b38;
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.5;
    }

    input::placeholder, textarea::placeholder {
      color: #6b7280;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #0d1119;
      min-width: 1100px;
    }

    th {
      background: #111722;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      padding: 15px 16px;
      text-align: left;
      border-bottom: 1px solid #222938;
      white-space: nowrap;
    }

    td {
      color: #e5e7eb;
      font-size: 14px;
      padding: 16px;
      border-bottom: 1px solid #1b2230;
      white-space: nowrap;
    }

    tr:hover td {
      background: #121926;
    }

    .owner-name {
      font-weight: 600;
      color: #fff;
    }

    .remarks {
      color: #cbd5e1;
      max-width: 260px;
      white-space: normal;
      line-height: 1.4;
    }

    .source-badge {
      display: inline-flex;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.22);
      color: #93c5fd;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: none;
      color: white;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .whatsapp {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.18);
    }

    .edit {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.18);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 35px;
    }

    /* Premium Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal {
      width: 460px;
      max-width: 92%;
      background: rgba(17, 22, 32, 0.95);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.55);
      transform: translateY(18px) scale(0.96);
      animation: modalIn 0.25s ease forwards;
    }

    @keyframes modalIn {
      to {
        transform: translateY(0) scale(1);
      }
    }

    .modal h3 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 600;
    }

    .modal p {
      margin: 0 0 16px;
      color: #8b95a7;
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .cancel-btn {
      background: #1f2937;
    }

    .save-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    @media (max-width: 1100px) {
      .filters { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 700px) {
      body { padding: 18px; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 14px; }
      .filters { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<div class="page-header">
  <div class="title-block">
    <h2>Usama Bin Nusrat</h2>
    <p>Owner database · WhatsApp outreach · Remarks tracking</p>
  </div>

  <div class="status-pill">Live CRM Connected</div>
</div>

<div class="panel">
  <div class="filters">
    <input id="searchInput" type="text" placeholder="Search owner, phone, unit...">

    <select id="communityFilter">
      <option value="">Community</option>
    </select>

    <select id="clusterFilter">
      <option value="">Cluster / Tower</option>
    </select>

    <input id="unitFilter" type="text" placeholder="Unit">

    <select id="sourceFilter">
      <option value="">Data Source</option>
    </select>
  </div>

  <div class="table-wrap">
    <table id="dataTable"></table>
  </div>
</div>

<!-- Premium Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>Edit Remarks</h3>
    <p>Update owner remarks and save directly to Google Sheets.</p>

    <textarea id="modalRemarks" placeholder="Write remarks here..."></textarea>

    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="save-btn" onclick="saveModalRemarks()">Save Remarks</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://vnydxkmhrcesdffpfjpc.supabase.co";

const SUPABASE_KEY = "sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I";

const HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

let fullData = [];
let activeUnitKey = "";

function formatDate(dateString) {
  if (!dateString) return "";

  const date = new Date(dateString);
  if (isNaN(date)) return dateString;

  const months = [
    "January","February","March","April",
    "May","June","July","August",
    "September","October","November","December"
  ];

  return `${months[date.getMonth()]}-${date.getFullYear()}`;
}

async function loadData() {
  showLoading();

  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/owners?select=*&order=id.asc&limit=100`,
    { headers: HEADERS }
  );

  fullData = await res.json();
  filteredData = fullData;

  populateFilters();
  currentPage = 1;
  renderTable();
}

function populateFilters() {
  addOptions("communityFilter", [...new Set(fullData.map(row => row.community).filter(Boolean))]);
  addOptions("clusterFilter", [...new Set(fullData.map(row => row.cluster).filter(Boolean))]);

  const formattedSources = [...new Set(
    fullData
      .map(row => row.dataSource)
      .filter(Boolean)
      .map(source => formatDate(source))
  )];

  addOptions("sourceFilter", formattedSources);
}

function addOptions(id, values) {
  const select = document.getElementById(id);
  const firstOption = select.options[0].outerHTML;

  select.innerHTML = firstOption;

  values.sort().forEach(value => {
    select.innerHTML += `<option value="${value}">${value}</option>`;
  });
}

function getFirstName(name) {
  return name ? String(name).trim().split(" ")[0] : "";
}

function escapeText(text) {
  return String(text || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, "&quot;");
}

function renderTable(data) {
  const table = document.getElementById("dataTable");

  table.innerHTML = `
    <tr>
      <th>Community</th>
      <th>Cluster/Tower</th>
      <th>Unit</th>
      <th>Owner</th>
      <th>Phone</th>
      <th>Email</th>
      <th>Remarks</th>
      <th>Source</th>
      <th>Action</th>
    </tr>
  `;

  if (!data.length) {
    table.innerHTML += `
      <tr>
        <td colspan="9" class="empty">No matching records found</td>
      </tr>
    `;
    return;
  }

  data.forEach(row => {
    const phone = String(row.phone1 || "").replace(/\D/g, "");
    const firstName = getFirstName(row.owner);
    const unitKey = `${row.community}|${row.cluster}|${row.unit}`.toLowerCase();

    const message = `Hello, Mr. ${firstName}

Hope You're Doing Well.

This is Usama from BFG Properties.

I'm reaching out regarding your property in ${row.cluster || ""} (Unit#${row.unit || ""}), ${row.community || ""}.

Would you consider selling if you receive a strong offer?

Waiting for your kind response.

Regards,
Usama Bin Nusrat.`;

    const whatsappLink = phone.length >= 9
      ? `https://wa.me/${phone}?text=${encodeURIComponent(message)}`
      : "#";

    table.innerHTML += `
      <tr>
        <td>${row.community || ""}</td>
        <td>${row.cluster || ""}</td>
        <td>${row.unit || ""}</td>
        <td class="owner-name">${row.owner || ""}</td>
        <td>${phone}</td>
        <td>${row.email || ""}</td>
        <td class="remarks">${row.remarks || ""}</td>
        <td><span class="source-badge">${formatDate(row.dataSource)}</span></td>
        <td>
          <div class="actions">
            <button class="whatsapp" onclick="sendWhatsApp('${unitKey}', '${whatsappLink}')">WhatsApp</button>
            <button class="edit" onclick="openEditModal('${unitKey}', '${escapeText(row.remarks)}')">Edit</button>
          </div>
        </td>
      </tr>
    `;
  });
}

async function sendWhatsApp(unitKey, link) {
  if (link === "#") {
    alert("Invalid WhatsApp number");
    return;
  }

  window.open(link, "_blank");

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateWhatsappStatus",
      unitKey: unitKey
    })
  });

  loadData();
}

function openEditModal(unitKey, remarks) {
  activeUnitKey = unitKey;
  document.getElementById("modalRemarks").value = remarks || "";
  document.getElementById("editModal").classList.add("active");
}

function closeModal() {
  document.getElementById("editModal").classList.remove("active");
  activeUnitKey = "";
}

async function saveModalRemarks() {
  const newRemarks = document.getElementById("modalRemarks").value;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateRemarks",
      unitKey: activeUnitKey,
      remarks: newRemarks
    })
  });

  closeModal();
  loadData();
}

function applyFilters() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const community = document.getElementById("communityFilter").value;
  const cluster = document.getElementById("clusterFilter").value;
  const unit = document.getElementById("unitFilter").value.toLowerCase();
  const source = document.getElementById("sourceFilter").value;

  const filtered = fullData.filter(row => {
    const combined = `${row.community} ${row.cluster} ${row.unit} ${row.owner} ${row.phone1} ${row.phone2} ${row.email} ${row.remarks} ${formatDate(row.dataSource)}`.toLowerCase();

    return (
      combined.includes(search) &&
      (!community || row.community === community) &&
      (!cluster || row.cluster === cluster) &&
      (!unit || String(row.unit).toLowerCase().includes(unit)) &&
      (!source || formatDate(row.dataSource) === source)
    );
  });

  renderTable(filtered);
}

document.getElementById("searchInput").addEventListener("input", applyFilters);
document.getElementById("communityFilter").addEventListener("change", applyFilters);
document.getElementById("clusterFilter").addEventListener("change", applyFilters);
document.getElementById("unitFilter").addEventListener("input", applyFilters);
document.getElementById("sourceFilter").addEventListener("change", applyFilters);

document.getElementById("editModal").addEventListener("click", function(e) {
  if (e.target.id === "editModal") {
    closeModal();
  }
});

loadData();
</script>

</body>
</html>
