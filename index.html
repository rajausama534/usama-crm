<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Owner Database</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin:0;
  background:#0f1115;
  color:#fff;
  font-family:Poppins;
}

.container {
  max-width:1200px;
  margin:auto;
  padding:20px;
}

input, select, textarea {
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #2a2d35;
  background:#171a21;
  color:#fff;
}

.filters {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  margin-bottom:20px;
}

.cards {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:14px;
}

.card {
  background:#171a21;
  padding:15px;
  border-radius:16px;
  border:1px solid #2a2d35;
}

.owner-line {
  display:flex;
  gap:8px;
  align-items:center;
}

.more-btn {
  background:#2b5cff;
  border:none;
  color:#fff;
  padding:4px 8px;
  border-radius:6px;
  font-size:11px;
  cursor:pointer;
}

.whatsapp {
  background:#25d366;
  color:#000;
  padding:8px;
  border-radius:8px;
  text-decoration:none;
  font-size:12px;
}

.location {
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

textarea {
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>Owner Database</h2>

<div class="filters">
<input id="search" placeholder="Search...">
<select id="community"></select>
<select id="cluster"></select>
<select id="source"></select>
</div>

<div id="cards" class="cards"></div>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://vnydxkmhrcesdffpfjpc.supabase.co",
  "sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I"
);
);

let data = [];

async function load() {
  let { data: rows } = await supabase
    .from("properties")
    .select("*");

  data = rows || [];
  render();
}

function render() {
  const cards = document.getElementById("cards");
  cards.innerHTML = "";

  const search = document.getElementById("search").value.toLowerCase();

  data.forEach(row => {

    if (
      search &&
      !(
        row.owner_name?.toLowerCase().includes(search) ||
        row.phone?.includes(search)
      )
    ) return;

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="owner-line">
        <h3>${row.owner_name || "No Name"}</h3>
      </div>

      <p>${row.phone || ""}</p>

      <div class="location">
        <div>
          <b>${row.community}</b><br>
          ${row.cluster} - ${row.unit_no}
        </div>

        <a class="whatsapp" target="_blank"
          href="https://wa.me/${(row.phone||"").replace(/\D/g,'')}">
          WhatsApp
        </a>
      </div>

      <select onchange="update('${row.id}','status',this.value)">
        <option value="">Status</option>
        <option ${row.status=="For Sale"?"selected":""}>For Sale</option>
        <option ${row.status=="For Rent"?"selected":""}>For Rent</option>
        <option ${row.status=="Sold"?"selected":""}>Sold</option>
      </select>

      <textarea onblur="update('${row.id}','remarks',this.value)">
        ${row.remarks || ""}
      </textarea>
    `;

    cards.appendChild(div);
  });
}

async function update(id, field, value) {
  await supabase
    .from("properties")
    .update({ [field]: value })
    .eq("id", id);
}

document.getElementById("search").oninput = render;

load();
</script>

</body>
</html>
