<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usama CRM Unit Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#03070d;--panel:#07101a;--line:#1c2c3d;--text:#f4f7fb;--muted:#93a4b8;--blue:#1593e6;--cyan:#14b8c4;--green:#20c997;--amber:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,rgba(21,147,230,.14),transparent 35%),var(--bg);color:var(--text);font-family:Poppins,sans-serif;min-height:100vh}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(2,6,11,.92)}.brand{font-size:22px;font-weight:700}.brand span{color:var(--blue)}.back{color:#fff;text-decoration:none;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600}.wrap{max-width:1100px;margin:0 auto;padding:36px 20px}.hero h1{font-size:34px;margin:0 0 8px}.hero p{color:var(--muted);margin:0 0 24px}.search{display:grid;grid-template-columns:1fr 170px;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.search input{height:50px;border:1px solid #29405a;background:#030910;color:#fff;border-radius:11px;padding:0 15px;font:500 14px Poppins}.search button{border:0;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:white;font:700 14px Poppins;cursor:pointer}.status{margin-top:12px;color:var(--muted);font-size:13px}.result{display:none;margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.result.show{display:block}.resultHead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.badge{font-size:11px;font-weight:700;color:#062b22;background:#55e6bd;padding:6px 9px;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}.item{background:#050b13;padding:17px 18px;min-height:88px}.item span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:700;margin-bottom:7px}.item strong{display:block;font-size:15px;word-break:break-word}.resolver{margin:16px 20px 20px;padding:15px;border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.08);border-radius:12px;color:#ffd58a;font-size:13px;line-height:1.5}.error{color:#ff7f88}.empty{color:var(--muted)}@media(max-width:720px){.top{height:62px;padding:0 14px}.brand{font-size:18px}.wrap{padding:24px 12px}.hero h1{font-size:27px}.search{grid-template-columns:1fr}.search button{height:46px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:440px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="brand">Usama <span>CRM</span> · Unit Finder</div><a class="back" href="/">Back to CRM</a></header>
<main class="wrap">
<section class="hero"><h1>Find listing details</h1><p>Paste a Bayut property link to extract its permit, listing reference and public property information.</p></section>
<section class="search"><input id="url" placeholder="https://www.bayut.com/property/details-...html"><button id="analyse" onclick="analyse()">Analyse Listing</button></section>
<div id="status" class="status">Bayut property-details links are supported.</div>
<section id="result" class="result"><div class="resultHead"><strong>Listing Result</strong><span class="badge">EXTRACTED</span></div><div id="grid" class="grid"></div><div id="resolver" class="resolver"></div></section>
</main>
<script>
const esc=s=>String(s??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=n=>n?`AED ${Number(n).toLocaleString('en-US')}`:'-';
function cell(label,value){return `<div class="item"><span>${esc(label)}</span><strong>${esc(value??'-')}</strong></div>`}
async function analyse(){
 const url=document.getElementById('url').value.trim(),btn=document.getElementById('analyse'),status=document.getElementById('status'),result=document.getElementById('result');
 if(!url){status.innerHTML='<span class="error">Paste a Bayut listing link.</span>';return}
 btn.disabled=true;btn.textContent='Checking…';status.textContent='Reading the listing…';result.classList.remove('show');
 try{
  const r=await fetch('/api/unit-finder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not analyse listing');
  document.getElementById('grid').innerHTML=[
   cell('Listing ID',d.listingId),cell('Permit Number',d.permitNumber),cell('Reference',d.referenceNumber),
   cell('Project',d.project),cell('Building',d.building),cell('Area',d.area),
   cell('Bedrooms',d.bedrooms?`${d.bedrooms} BR`:'-'),cell('Bathrooms',d.bathrooms),cell('Size',d.sizeSqft?`${Number(d.sizeSqft).toLocaleString('en-US')} sq ft`:'-'),
   cell('Price',money(d.price)),cell('Agency',d.agency),cell('Broker',d.broker),
   cell('Unit Number',d.unitNumber),cell('Property Number',d.propertyNumber),cell('Land Number',d.landNumber)
  ].join('');
  document.getElementById('resolver').textContent=d.note||'Exact unit number requires an authorised resolver.';
  result.classList.add('show');status.textContent='Listing analysed successfully.';
 }catch(e){status.innerHTML=`<span class="error">${esc(e.message)}</span>`}
 finally{btn.disabled=false;btn.textContent='Analyse Listing'}
}
document.getElementById('url').addEventListener('keydown',e=>{if(e.key==='Enter')analyse()});
</script>
</body>
</html>
