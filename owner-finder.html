<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Finder</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#030609;color:#f3f6fb;font-family:Poppins;padding:22px}.wrap{max-width:1550px;margin:auto}.top{display:flex;justify-content:space-between}.sub,.meta{color:#8295b0}.btn,.mode{border:1px solid #123052;background:#050a11;color:#fff;border-radius:14px;padding:13px 18px;font:600 13px Poppins;cursor:pointer}.primary{background:#0bb38e}.modes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:28px 0}.mode{text-align:left;padding:28px}.mode.active{border-color:#17c9bd}.panel{border:1px solid #10294a;border-radius:20px;padding:24px}.hidden{display:none}.search{display:grid;grid-template-columns:1fr auto;gap:10px}.search input{background:#020305;border:1px solid #304763;color:#fff;border-radius:13px;padding:15px}.stats{display:flex;gap:10px;margin:18px 0}.chip{border:1px solid #123052;border-radius:999px;padding:8px 13px;color:#a8b7ca}.result{border:1px solid #162b44;background:#07101a;border-radius:15px;padding:16px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;margin-top:10px}.field{background:#0a1421;border-radius:10px;padding:10px}.label{font-size:10px;color:#7287a2}.drop{border:2px dashed #29435f;border-radius:18px;padding:42px;text-align:center}.drop.drag{border-color:#1bc9c0}.inputs{display:flex;gap:10px;justify-content:center;margin-top:15px}.inputs input{display:none}.status{margin-top:15px;border:1px solid #17314b;padding:12px;border-radius:11px}.barbg{height:7px;background:#09111c;margin-top:8px}.bar{height:100%;width:0;background:#19c3a8}.file{display:flex;justify-content:space-between;border:1px solid #18304b;border-radius:12px;padding:11px;margin-top:8px}.danger{background:#2b1118;color:#ff9cab;border:1px solid #672634;border-radius:9px}.empty{text-align:center;padding:45px;color:#7187a4}@media(max-width:800px){.modes,.grid,.search{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>Owner Finder</h1><div class="sub">Existing CRM + permanently uploaded online databases.</div></div><button class="btn" onclick="location.href='index.html'">← CRM Home</button></div><div class="modes"><button class="mode active" id="sm"><h2>⌕ Search by Name / Property Detail</h2><div class="sub">Search all owner and property records.</div></button><button class="mode" id="um"><h2>⇧ Upload Files / Folder</h2><div class="sub">Upload once from your MacBook. Data stays online.</div></button></div><section class="panel" id="sp"><div class="search"><input id="q" placeholder="Raju, Ahmad Muhammed, Farm Gardens 2, Villa 120, +97150..."><button class="btn primary" id="go">Search</button></div><div class="stats" id="stats"></div><div id="results"><div class="empty">Search existing CRM owners and uploaded databases.</div></div></section><section class="panel hidden" id="up"><div class="drop" id="drop"><h2>Upload databases from your MacBook</h2><div class="sub">Drag files here, choose many files, or choose an entire folder.</div><div class="inputs"><label class="btn primary" for="files">Choose Files</label><label class="btn" for="folder">Choose Folder</label><input id="files" type="file" multiple accept=".xlsx,.xls,.csv,.tsv,.txt"><input id="folder" type="file" webkitdirectory multiple></div></div><div class="status" id="status">Ready. Uploaded data will stay online.<div class="barbg"><div class="bar" id="bar"></div></div></div><div id="fileList"></div></section></div><script>
const CU='https://vnydxkmhrcesdffpfjpc.supabase.co',CK='sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I',API='https://fkhboleibqrrqljmwbit.supabase.co/functions/v1/owner-finder-api',crm=supabase.createClient(CU,CK);let ses;const $=x=>document.getElementById(x),cl=v=>v==null?'':String(v).trim(),nm=v=>cl(v).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9+]+/g,' ').replace(/\s+/g,' ').trim(),esc=v=>cl(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){ses=(await crm.auth.getSession()).data.session;if(!ses){alert('Login to CRM first.');location.href='index.html';return}stats()}async function api(action,data={}){ses=ses||(await crm.auth.getSession()).data.session;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ses.access_token},body:JSON.stringify({action,...data})}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function mode(s){$('sp').classList.toggle('hidden',!s);$('up').classList.toggle('hidden',s);$('sm').classList.toggle('active',s);$('um').classList.toggle('active',!s)}$('sm').onclick=()=>mode(1);$('um').onclick=()=>mode(0);
function infer(row){let e=Object.entries(row),f=rs=>{let h=e.find(([k,v])=>rs.some(r=>r.test(nm(k)))&&cl(v));return h?cl(h[1]):''},a=rs=>[...new Set(e.filter(([k,v])=>rs.some(r=>r.test(nm(k)))&&cl(v)).map(x=>cl(x[1])))].join(' · ');let owner=f([/^owner name$/,/^owner$/,/customer name/,/client name/,/full name/,/^name$/]),phones=a([/phone/,/mobile/,/contact no/,/whatsapp/,/^tel/]),email=a([/email/]),community=f([/community/,/area/,/location/,/project/]),building=f([/building/,/tower/,/cluster/]),unit=f([/^unit$/,/unit no/,/villa/,/apartment/,/^apt/,/property no/]);return{owner,phones,email,property:[community,building,unit].filter(Boolean).join(' · ')}}function wbRows(w){let o=[];for(let sn of w.SheetNames)XLSX.utils.sheet_to_json(w.Sheets[sn],{defval:'',raw:false}).forEach((row,i)=>o.push({sheetName:sn,rowNo:i+2,row}));return o}async function parse(f){let x=f.name.split('.').pop().toLowerCase();if(['xlsx','xls'].includes(x))return wbRows(XLSX.read(await f.arrayBuffer(),{type:'array'}));if(['csv','tsv','txt'].includes(x))return wbRows(XLSX.read(await f.text(),{type:'string'}));throw Error('Unsupported file')}async function hash(f){let h=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function upload(list){let fs=[...list].filter(f=>/\.(xlsx|xls|csv|tsv|txt)$/i.test(f.name));if(!fs.length)return alert('No supported database files found.');let done=0;for(let f of fs){let id;try{$('status').firstChild.textContent='Reading '+f.name+'... ';let p=await parse(f),st=await api('startUpload',{fileName:f.webkitRelativePath||f.name,fileSize:f.size,fileHash:await hash(f),rowsCount:p.length});if(st.duplicate){done++;continue}id=st.fileId;let rs=p.map(x=>{let i=infer(x.row);return{ownerName:i.owner,phones:i.phones,email:i.email,property:i.property,searchable:nm(Object.entries(x.row).map(([k,v])=>k+' '+cl(v)).join(' ')),sheetName:x.sheetName,rowNo:x.rowNo,row:x.row}});for(let i=0;i<rs.length;i+=300){$('status').firstChild.textContent=`Uploading ${f.name}: ${Math.min(i+300,rs.length)} / ${rs.length} rows... `;await api('uploadBatch',{fileId:id,rows:rs.slice(i,i+300)})}await api('finishUpload',{fileId:id});done++;$('bar').style.width=Math.round(done/fs.length*100)+'%'}catch(e){if(id)try{await api('failUpload',{fileId:id})}catch{}alert(f.name+': '+e.message)}}$('status').firstChild.textContent='Finished. Data is saved online. ';stats()}$('files').onchange=e=>upload(e.target.files);$('folder').onchange=e=>upload(e.target.files);let d=$('drop');d.ondragover=e=>{e.preventDefault();d.classList.add('drag')};d.ondragleave=()=>d.classList.remove('drag');d.ondrop=e=>{e.preventDefault();d.classList.remove('drag');upload(e.dataTransfer.files)};
async function stats(){try{let s=await api('stats');$('stats').innerHTML=`<span class="chip">Existing CRM connected</span><span class="chip">${s.files} online files</span><span class="chip">${s.rows.toLocaleString()} uploaded rows</span>`;$('fileList').innerHTML=(s.fileRows||[]).map(f=>`<div class="file"><div><b>${esc(f.file_name)}</b><div class="meta">${Number(f.rows_count).toLocaleString()} rows</div></div><button class="danger" onclick="del('${f.id}')">Delete</button></div>`).join('')}catch(e){$('stats').innerHTML='<span class="chip">'+esc(e.message)+'</span>'}}async function del(id){if(confirm('Delete this uploaded database?')){await api('deleteFile',{fileId:id});stats()}}
async function crmSearch(q){let s=q.replace(/[%(),]/g,' ').trim();if(!s)return[];let {data,error}=await crm.from('owners').select('id,owner,phone1,phone2,community,cluster,unit,data_source').or(`owner.ilike.%${s}%,phone1.ilike.%${s}%,phone2.ilike.%${s}%,community.ilike.%${s}%,cluster.ilike.%${s}%,unit.ilike.%${s}%`).limit(150);if(error)return[];return(data||[]).map(r=>({owner_name:r.owner,phones:[r.phone1,r.phone2].filter(Boolean).join(' · '),property:[r.community,r.cluster,r.unit].filter(Boolean).join(' · '),file_name:r.data_source||'Existing CRM',row_data:r}))}function render(rs){$('results').innerHTML=rs.length?rs.map(r=>`<div class="result"><div><b>${esc(r.owner_name||'Owner name not identified')}</b> <span class="meta">— ${esc(r.file_name||'Database')}</span></div><div class="grid"><div class="field"><div class="label">PHONE</div>${esc(r.phones||'—')}</div><div class="field"><div class="label">EMAIL</div>${esc(r.email||'—')}</div><div class="field"><div class="label">PROPERTY</div>${esc(r.property||'—')}</div></div></div>`).join(''):'<div class="empty">No matching owner/property records found.</div>'}async function search(){let q=$('q').value.trim();if(!q)return;$('results').innerHTML='<div class="empty">Searching CRM + online databases...</div>';try{let[a,b]=await Promise.all([crmSearch(q),api('search',{q})]);render([...a,...(b.rows||[])])}catch(e){$('results').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}$('go').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};init();
</script></body></html>
