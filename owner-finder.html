<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Finder</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#030609;color:#f3f6fb;font-family:Poppins,sans-serif;padding:18px}.wrap{max-width:1550px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.top h1{margin:0;font-size:30px}.sub,.meta{color:#8295b0}.homeLink{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:13px;padding:7px 10px;border:1px solid #123052;border-radius:9px;white-space:nowrap}.toolbar{display:flex;gap:8px;margin:18px 0}.tab{border:1px solid #123052;background:#050a11;color:#aab8cb;border-radius:9px;padding:9px 12px;font:600 12px Poppins;cursor:pointer}.tab.active{border-color:#17c9bd;color:#fff;background:#071316}.panel{border:1px solid #10294a;border-radius:16px;padding:18px}.hidden{display:none}.search{display:grid;grid-template-columns:1fr auto;gap:8px}.search input{background:#020305;border:1px solid #304763;color:#fff;border-radius:10px;padding:12px 13px;font:500 14px Poppins;min-width:0}.searchBtn{border:0;background:#0bb38e;color:#fff;border-radius:10px;padding:0 18px;font:700 13px Poppins;cursor:pointer}.stats{display:flex;gap:8px;margin:13px 0;flex-wrap:wrap}.chip{border:1px solid #123052;border-radius:9px;padding:7px 10px;color:#a8b7ca;font-size:12px;background:#060b12}.result{border:1px solid #162b44;background:#07101a;border-radius:13px;padding:14px;margin:9px 0}.resultHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.owner{font-size:16px;font-weight:700}.phone{font-size:13px;color:#dfe8f4;margin-top:3px}.sources{font-size:10px;color:#7589a3;text-align:right}.props{margin-top:10px;display:grid;gap:6px}.prop{background:#0a1421;border-radius:9px;padding:9px 10px;font-size:13px;line-height:1.35}.propMeta{font-size:10px;color:#70849f;margin-top:2px}.emailLine{font-size:11px;color:#93a5bb;margin-top:6px}.drop{border:2px dashed #29435f;border-radius:14px;padding:26px;text-align:center}.drop.drag{border-color:#1bc9c0}.drop h2{font-size:18px;margin:0 0 5px}.inputs{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}.inputs input{display:none}.smallBtn{display:inline-block;border:1px solid #123052;background:#07101a;color:#fff;border-radius:9px;padding:9px 12px;font:600 12px Poppins;cursor:pointer}.smallBtn.primary{background:#0bb38e;border-color:#0bb38e}.status{margin-top:12px;border:1px solid #17314b;padding:10px;border-radius:10px;font-size:12px}.barbg{height:6px;background:#09111c;margin-top:7px;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:#19c3a8}.file{display:flex;justify-content:space-between;align-items:center;border:1px solid #18304b;border-radius:10px;padding:9px 10px;margin-top:7px;font-size:12px}.danger{background:#2b1118;color:#ff9cab;border:1px solid #672634;border-radius:8px;padding:6px 9px;cursor:pointer}.empty{text-align:center;padding:32px;color:#7187a4;font-size:13px}@media(max-width:800px){body{padding:14px}.top{align-items:center}.top h1{font-size:27px}.top .sub{font-size:12px;line-height:1.45;margin-top:4px}.homeLink{font-size:11px;padding:6px 8px}.toolbar{margin:13px 0;gap:6px}.tab{flex:1;padding:8px 6px;font-size:11px}.panel{padding:12px;border-radius:13px}.search{grid-template-columns:1fr auto}.search input{padding:10px 11px;font-size:13px}.searchBtn{padding:0 13px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.chip{border-radius:8px;padding:7px 6px;font-size:10px;text-align:center;line-height:1.3}.result{padding:11px;margin:7px 0}.owner{font-size:15px}.phone{font-size:12px}.sources{font-size:9px;max-width:38%}.prop{padding:8px 9px;font-size:12px}.drop{padding:20px 12px}.drop h2{font-size:16px}}</style></head><body><div class="wrap"><div class="top"><div><h1>Owner Finder</h1><div class="sub">Existing CRM + permanently uploaded online databases.</div></div><a class="homeLink" href="index.html">← CRM Home</a></div><div class="toolbar"><button class="tab active" id="sm">Search</button><button class="tab" id="um">Upload Files / Folder</button></div><section class="panel" id="sp"><div class="search"><input id="q" placeholder="Name, phone, project or unit"><button class="searchBtn" id="go">Search</button></div><div class="stats" id="stats"></div><div id="results"><div class="empty">Search existing CRM owners and uploaded databases.</div></div></section><section class="panel hidden" id="up"><div class="drop" id="drop"><h2>Upload databases</h2><div class="sub">Upload files or a full MacBook folder once. Data stays online.</div><div class="inputs"><label class="smallBtn primary" for="files">Choose Files</label><label class="smallBtn" for="folder">Choose Folder</label><input id="files" type="file" multiple accept=".xlsx,.xls,.csv,.tsv,.txt"><input id="folder" type="file" webkitdirectory multiple></div></div><div class="status" id="status">Ready. Uploaded data will stay online.<div class="barbg"><div class="bar" id="bar"></div></div></div><div id="fileList"></div></section></div><script>
const CU='https://vnydxkmhrcesdffpfjpc.supabase.co',CK='sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I',API='https://fkhboleibqrrqljmwbit.supabase.co/functions/v1/owner-finder-api',crm=supabase.createClient(CU,CK);let ses;const $=x=>document.getElementById(x),cl=v=>v==null?'':String(v).trim(),nm=v=>cl(v).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9+]+/g,' ').replace(/\s+/g,' ').trim(),esc=v=>cl(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){ses=(await crm.auth.getSession()).data.session;if(!ses){alert('Login to CRM first.');location.href='index.html';return}stats()}async function api(action,data={}){ses=ses||(await crm.auth.getSession()).data.session;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ses.access_token},body:JSON.stringify({action,...data})}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function mode(s){$('sp').classList.toggle('hidden',!s);$('up').classList.toggle('hidden',s);$('sm').classList.toggle('active',s);$('um').classList.toggle('active',!s)}$('sm').onclick=()=>mode(1);$('um').onclick=()=>mode(0);
function infer(row){let e=Object.entries(row),f=rs=>{let h=e.find(([k,v])=>rs.some(r=>r.test(nm(k)))&&cl(v));return h?cl(h[1]):''},a=rs=>[...new Set(e.filter(([k,v])=>rs.some(r=>r.test(nm(k)))&&cl(v)).map(x=>cl(x[1])))].join(' · ');let owner=f([/^owner name$/,/^owner$/,/customer name/,/client name/,/full name/,/^name$/]),phones=a([/phone/,/mobile/,/contact no/,/whatsapp/,/^tel/]),email=a([/email/]),community=f([/community/,/area/,/location/,/project/]),building=f([/building/,/tower/,/cluster/]),unit=f([/^unit$/,/unit no/,/villa/,/apartment/,/^apt/,/property no/]);return{owner,phones,email,property:[community,building,unit].filter(Boolean).join(' · ')}}function wbRows(w){let o=[];for(let sn of w.SheetNames)XLSX.utils.sheet_to_json(w.Sheets[sn],{defval:'',raw:false}).forEach((row,i)=>o.push({sheetName:sn,rowNo:i+2,row}));return o}async function parse(f){let x=f.name.split('.').pop().toLowerCase();if(['xlsx','xls'].includes(x))return wbRows(XLSX.read(await f.arrayBuffer(),{type:'array'}));if(['csv','tsv','txt'].includes(x))return wbRows(XLSX.read(await f.text(),{type:'string'}));throw Error('Unsupported file')}async function hash(f){let h=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function upload(list){let fs=[...list].filter(f=>/\.(xlsx|xls|csv|tsv|txt)$/i.test(f.name));if(!fs.length)return alert('No supported database files found.');let done=0;for(let f of fs){let id;try{$('status').firstChild.textContent='Reading '+f.name+'... ';let p=await parse(f),st=await api('startUpload',{fileName:f.webkitRelativePath||f.name,fileSize:f.size,fileHash:await hash(f),rowsCount:p.length});if(st.duplicate){done++;continue}id=st.fileId;let rs=p.map(x=>{let i=infer(x.row);return{ownerName:i.owner,phones:i.phones,email:i.email,property:i.property,searchable:nm(Object.entries(x.row).map(([k,v])=>k+' '+cl(v)).join(' ')),sheetName:x.sheetName,rowNo:x.rowNo,row:x.row}});for(let i=0;i<rs.length;i+=300){$('status').firstChild.textContent=`Uploading ${f.name}: ${Math.min(i+300,rs.length)} / ${rs.length} rows... `;await api('uploadBatch',{fileId:id,rows:rs.slice(i,i+300)})}await api('finishUpload',{fileId:id});done++;$('bar').style.width=Math.round(done/fs.length*100)+'%'}catch(e){if(id)try{await api('failUpload',{fileId:id})}catch{}alert(f.name+': '+e.message)}}$('status').firstChild.textContent='Finished. Data is saved online. ';stats()}$('files').onchange=e=>upload(e.target.files);$('folder').onchange=e=>upload(e.target.files);let d=$('drop');d.ondragover=e=>{e.preventDefault();d.classList.add('drag')};d.ondragleave=()=>d.classList.remove('drag');d.ondrop=e=>{e.preventDefault();d.classList.remove('drag');upload(e.dataTransfer.files)};
async function stats(){try{let s=await api('stats');$('stats').innerHTML=`<span class="chip">CRM connected</span><span class="chip">${s.files} online files</span><span class="chip">${s.rows.toLocaleString()} uploaded rows</span>`;$('fileList').innerHTML=(s.fileRows||[]).map(f=>`<div class="file"><div><b>${esc(f.file_name)}</b><div class="meta">${Number(f.rows_count).toLocaleString()} rows</div></div><button class="danger" onclick="del('${f.id}')">Delete</button></div>`).join('')}catch(e){$('stats').innerHTML='<span class="chip">'+esc(e.message)+'</span>'}}async function del(id){if(confirm('Delete this uploaded database?')){await api('deleteFile',{fileId:id});stats()}}
async function crmSearch(q){let s=q.replace(/[%(),]/g,' ').trim();if(!s)return[];let {data,error}=await crm.from('owners').select('id,owner,phone1,phone2,community,cluster,unit,data_source').or(`owner.ilike.%${s}%,phone1.ilike.%${s}%,phone2.ilike.%${s}%,community.ilike.%${s}%,cluster.ilike.%${s}%,unit.ilike.%${s}%`).limit(300);if(error)return[];return(data||[]).map(r=>({owner_name:r.owner,phones:[r.phone1,r.phone2].filter(Boolean).join(' · '),property:[r.community,r.cluster,r.unit].filter(Boolean).join(' · '),file_name:r.data_source||'Existing CRM',row_data:r}))}
function phoneParts(v){return cl(v).split(/\s*[·|,;/]\s*|\s{2,}/).map(x=>x.replace(/[^0-9+]/g,'')).filter(x=>x.replace(/\D/g,'').length>=6)}function phoneKey(v){let p=phoneParts(v)[0]||'';let d=p.replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('971'))return d;if(d.startsWith('0')&&d.length>=9)return '971'+d.slice(1);return d||''}
function groupResults(rows){let map=new Map();for(let r of rows){let key=phoneKey(r.phones);if(!key)key='name:'+nm(r.owner_name||'unknown');let g=map.get(key);if(!g){g={key,phone:phoneParts(r.phones)[0]||r.phones||'',names:new Set(),emails:new Set(),properties:new Map(),sources:new Set()};map.set(key,g)}if(cl(r.owner_name))g.names.add(cl(r.owner_name));if(cl(r.email))cl(r.email).split(/\s*[·|,;]\s*/).filter(Boolean).forEach(x=>g.emails.add(x));if(cl(r.file_name))g.sources.add(cl(r.file_name));let prop=cl(r.property);if(prop){let pk=nm(prop);if(!g.properties.has(pk))g.properties.set(pk,{text:prop,sources:new Set()});if(cl(r.file_name))g.properties.get(pk).sources.add(cl(r.file_name))}}return[...map.values()]}
function render(rs){let gs=groupResults(rs);$('results').innerHTML=gs.length?gs.map(g=>{let names=[...g.names],props=[...g.properties.values()],sources=[...g.sources];return`<div class="result"><div class="resultHead"><div><div class="owner">${esc(names.join(' / ')||'Owner name not identified')}</div><div class="phone">${esc(g.phone||'No phone number')}</div>${g.emails.size?`<div class="emailLine">${esc([...g.emails].join(' · '))}</div>`:''}</div><div class="sources">${esc(sources.join(' · '))}</div></div><div class="props">${props.length?props.map(p=>`<div class="prop">${esc(p.text)}${p.sources.size?`<div class="propMeta">${esc([...p.sources].join(' · '))}</div>`:''}</div>`).join(''):'<div class="prop">No property detail</div>'}</div></div>`}).join(''):'<div class="empty">No matching owner/property records found.</div>'}
async function search(){let q=$('q').value.trim();if(!q)return;$('results').innerHTML='<div class="empty">Searching CRM + online databases...</div>';try{let[a,b]=await Promise.all([crmSearch(q),api('search',{q})]);render([...a,...(b.rows||[])])}catch(e){$('results').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}$('go').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};init();
</script></body></html>
