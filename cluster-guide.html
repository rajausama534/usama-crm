<!doctype html>
<html lang="en">
<head>
<script>/* apply saved theme before first paint (no flash) */try{if(localStorage.getItem("crm_theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cluster Guide · Usama CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0f17;--surface:#111723;--surface-2:#161e2d;--raised:#1b2435;--border:rgba(148,163,184,.14);--border-strong:rgba(148,163,184,.26);--text:#e8edf5;--muted:#8a96aa;--faint:#5f6b7e;--accent:#5b6cff;--accent-soft:rgba(91,108,255,.14);--accent-text:#aab4ff;--ok:#22c55e;--warn:#f59e0b;--r:12px;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.18)}
html[data-theme="light"]{--bg:#f4f6fa;--surface:#fff;--surface-2:#f0f2f7;--raised:#fff;--border:rgba(15,23,42,.09);--border-strong:rgba(15,23,42,.17);--text:#0f172a;--muted:#5b6474;--faint:#8a93a4;--accent:#4f5bd5;--accent-soft:rgba(79,91,213,.10);--accent-text:#3c48c0;--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{font-weight:700;font-size:16px}.brand span{color:var(--accent)}
.top .spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#fca5a5;border-color:rgba(239,68,68,.4)}
html[data-theme="light"] .btn.danger{color:#b91c1c}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.icon-btn{width:36px;padding:0}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;max-width:1440px;margin:0 auto;padding:24px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px}
.list{position:sticky;top:84px;max-height:calc(100vh - 108px);display:flex;flex-direction:column;overflow:hidden}
.list-head{padding:16px;border-bottom:1px solid var(--border);display:grid;gap:8px}
input,select,textarea{width:100%;height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.list-body{overflow-y:auto;padding:8px}
.group{margin:8px 0 4px;padding:0 8px;color:var(--faint);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer}
.item:hover{background:var(--surface-2)}
.item.active{background:var(--accent-soft)}
.item strong{font-weight:600}
.item small{color:var(--muted);font-size:12px}
.detail{min-height:60vh}
.hero{padding:28px 28px 20px;border-bottom:1px solid var(--border)}
.eyebrow{color:var(--muted);font-size:13px}
.hero h1{margin:4px 0 6px;font-size:30px;font-weight:700;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:20px 28px}
.fact{padding:14px 16px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg)}
.fact span{display:block;color:var(--muted);font-size:12px;font-weight:500}
.fact b{display:block;margin-top:4px;font-size:18px;font-weight:700}
.fact .na{color:var(--faint);font-size:14px;font-weight:500}
.section{padding:8px 28px 24px}
.section h2{margin:12px 0 10px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.configs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.config{padding:16px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg)}
.config h3{margin:0 0 2px;font-size:18px}
.config .type{color:var(--muted);font-size:12px}
.config dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0 0}
.config dt{color:var(--muted);font-size:12px}
.config dd{margin:0;font-weight:600;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.src{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.src li{padding:12px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg)}
.src a{color:var(--accent-text);font-weight:600;text-decoration:none}
.src small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.note{padding:12px 14px;border-radius:var(--r);border:1px dashed var(--border-strong);color:var(--muted);font-size:13px}
.empty{display:grid;place-items:center;text-align:center;min-height:50vh;padding:40px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.skeleton{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--raised),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.err{margin:16px;padding:12px 14px;border-radius:var(--r);background:rgba(239,68,68,.12);color:#fca5a5}
html[data-theme="light"] .err{color:#b91c1c}
/* editor */
.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,6,12,.65)}
html[data-theme="light"] .scrim{background:rgba(15,23,42,.35)}
.modal{display:flex;flex-direction:column;width:min(880px,100%);max-height:calc(100vh - 32px);border:1px solid var(--border-strong);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.modal header,.modal footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 20px}
.modal header{border-bottom:1px solid var(--border)}.modal footer{border-top:1px solid var(--border);justify-content:flex-end}
.modal h2{margin:0;font-size:18px}
.modal .body{padding:20px;overflow-y:auto;display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.mix{width:100%;border-collapse:collapse;font-size:13px}
.mix th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:6px}
.mix td{padding:4px}
.mix input{height:34px;font-size:13px;padding:0 8px}
.meta{margin-top:10px;color:var(--faint);font-size:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--bg)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{padding:10px 12px;text-align:left;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl td b,.tbl td:first-child{white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td b{font-weight:700}
.tbl .sub{display:block;min-width:110px;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}
.tbl .tot td{background:var(--surface-2);font-weight:600}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-size:10px;font-weight:600;vertical-align:middle}
.up{color:var(--ok);font-weight:700}.down{color:#f87171;font-weight:700}
html[data-theme="light"] .down{color:#b91c1c}
.dim{color:var(--faint)}
.flag{margin-top:10px;padding:10px 14px;border-radius:var(--r);background:rgba(245,158,11,.12);color:var(--warn);font-size:13px}
.facts.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.fact small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
@media (max-width:980px){.facts.six{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.list{position:static;max-height:none}.list-body{max-height:40vh}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.layout{padding:12px;gap:12px}.top{padding:10px 12px}.hero,.facts,.section{padding-left:16px;padding-right:16px}.hero h1{font-size:24px}.grid2{grid-template-columns:1fr}.mix{display:block;overflow-x:auto}}
</style>
</head>
<body>
<header class="top">
  <a class="btn sm" href="index.html">← CRM</a>
  <div class="brand">Cluster <span>Guide</span></div>
  <div class="spacer"></div>
  <button class="btn sm icon-btn" id="theme" title="Light / dark">◐</button>
  <button class="btn sm primary" id="add" hidden>+ Add cluster</button>
</header>
<main class="layout">
  <aside class="panel list">
    <div class="list-head">
      <input id="q" placeholder="Search project or community" autocomplete="off">
      <select id="community"><option value="">All communities</option></select>
    </div>
    <div class="list-body" id="list"><div class="skeleton" style="margin:12px"></div><div class="skeleton" style="margin:12px"></div></div>
  </aside>
  <section class="panel detail" id="detail"><div class="empty"><div><b>Choose a project</b>Select a cluster on the left to see its verified details.</div></div></section>
</main>
<script>
const CU='https://vnydxkmhrcesdffpfjpc.supabase.co',CK='sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I',API=CU+'/functions/v1/cluster-guide-api';
const db=supabase.createClient(CU,CK);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
const range=(a,b)=>a&&b?(a===b?`${fmt(a)}`:`${fmt(a)} – ${fmt(b)}`):(a||b?fmt(a||b):'');
const byName=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'});
let clusters=[],canEdit=false,activeId=null,cache={};

async function api(action,data={}){
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.href='index.html';throw new Error('Not signed in');}
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,...data})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Request failed');
  return j;
}

function renderList(){
  const q=$('q').value.trim().toLowerCase(),comm=$('community').value;
  const rows=clusters.filter(c=>(!comm||c.community===comm)&&(!q||`${c.name} ${c.community} ${c.developer||''}`.toLowerCase().includes(q)));
  if(!rows.length){$('list').innerHTML='<p class="empty" style="min-height:0;padding:24px">No matching projects.</p>';return;}
  const groups={};rows.forEach(c=>(groups[c.community]=groups[c.community]||[]).push(c));
  $('list').innerHTML=Object.keys(groups).sort(byName).map(g=>`<div class="group">${esc(g)}</div>`+groups[g].sort((a,b)=>byName(a.name,b.name)).map(c=>`<button class="item ${c.id===activeId?'active':''}" data-id="${c.id}"><strong>${esc(c.name)}</strong><small>${c.bedrooms?.length?esc(c.bedrooms.join(', '))+' BR':''}</small></button>`).join('')).join('');
  $('list').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id));
}

const aed=n=>n?'AED '+fmt(Math.round(n)):'';
const short=n=>!n?'':n>=1e6?'AED '+(Math.round(n/1e4)/100)+'M':'AED '+Math.round(n/1e3)+'K';
const day=d=>d?new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const when=d=>d?new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const sq=(a,b)=>a||b?range(Math.round(a||b),Math.round(b||a))+' sq ft':'';
const pct=(now,then)=>now&&then?Math.round((now/then-1)*1000)/10:null;
const signed=v=>v==null?'<span class="dim">—</span>':`<span class="${v>=0?'up':'down'}">${v>=0?'+':''}${v}%</span>`;
const na='<span class="dim">—</span>';

// One row per bedroom type: researched launch price (else earliest recorded sales), CRM units and sizes, live market.
function bedroomRows(c){
  const st=c.stats||{},lp=c.launch_prices||[],lay=c.layouts||[];
  const keys=new Set([...(st.bedrooms||[]).map(x=>String(x.bedrooms)),...lp.map(x=>String(x.bedrooms)),...lay.map(x=>String(x.bedrooms)),...(c.unit_mix||[]).map(x=>String(x.bedrooms))].filter(Boolean));
  return [...keys].sort((a,b)=>Number(a)-Number(b)).map(b=>{
    const s=(st.bedrooms||[]).find(x=>String(x.bedrooms)===b)||{},pub=lp.find(x=>String(x.bedrooms)===b);
    const ls=lay.filter(x=>String(x.bedrooms)===b),m=s.market;
    const devBua=ls.flatMap(x=>[x.bua_min_sqft||x.bua_sqft,x.bua_max_sqft||x.bua_sqft]).filter(Boolean);
    const devPlot=ls.flatMap(x=>[x.plot_min_sqft,x.plot_max_sqft]).filter(Boolean);
    const launch=pub?{v:pub.aed,src:pub.source||'Published'}:s.first_sales?{v:s.first_sales.min,src:`First recorded sales, ${day(s.first_sales.first_date)}`}:null;
    return {b,units:s.units||0,bua:s.bua_min?[s.bua_min,s.bua_max,'CRM']:devBua.length?[Math.min(...devBua),Math.max(...devBua),'Emaar plan']:null,
      plot:s.plot_min?[s.plot_min,s.plot_max,'CRM']:devPlot.length?[Math.min(...devPlot),Math.max(...devPlot),'Emaar plan']:null,
      launch,m,trend:s.trend_pct,growth:m&&launch?pct(m.avg,launch.v):null};
  });
}

// One row per bedroom × layout: researched layouts merged with CRM-tagged units and their sales.
function layoutRows(c){
  const st=c.stats||{},rows=new Map();
  (c.layouts||[]).forEach(l=>{if(!l.name)return;rows.set(`${l.bedrooms}|${l.name.toLowerCase()}`,{b:String(l.bedrooms),name:l.name,dev:l});});
  (st.layouts||[]).forEach(l=>{const k=`${l.bedrooms}|${String(l.layout).toLowerCase()}`;rows.set(k,{...(rows.get(k)||{b:String(l.bedrooms),name:l.layout}),crm:l});});
  return [...rows.values()].sort((x,y)=>Number(x.b)-Number(y.b)||byName(x.name,y.name));
}

async function open(id,fresh){
  activeId=id;renderList();
  history.replaceState(null,'','#'+id);
  const d=$('detail');
  if(!cache[id]||fresh){if(!cache[id])d.innerHTML='<div style="padding:28px;display:grid;gap:12px"><div class="skeleton" style="width:40%;height:28px"></div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div>';
    try{cache[id]=(await api('getCluster',{id})).cluster;}catch(e){d.innerHTML=`<div class="err">${esc(e.message)}</div>`;return;}}
  render(cache[id]);
}

function render(c){
  const d=$('detail'),st=c.stats||{},lay=c.layouts||[],beds=bedroomRows(c),lrows=layoutRows(c);
  const layoutNames=[...new Set(lay.map(l=>l.name).filter(Boolean))];
  const fact=(label,val,sub)=>`<div class="fact"><span>${label}</span>${val?`<b>${val}</b>`:'<b class="na">Not published</b>'}${sub?`<small>${sub}</small>`:''}</div>`;
  const tot=beds.reduce((a,r)=>a+r.units,0);
  const lowCover=c.total_units&&st.units_total&&st.units_total<c.total_units*0.8;
  d.innerHTML=`<div class="hero"><div class="eyebrow">${esc(c.community)}${c.developer?` · ${esc(c.developer)}`:''}</div><h1>${esc(c.name)}</h1>
      <div class="chips">${c.development_type?`<span class="chip">${esc(c.development_type)}</span>`:''}${beds.length?`<span class="chip">${esc(beds.map(r=>r.b).join(', '))} bedrooms</span>`:''}${c.usp?`<span class="chip">${esc(c.usp)}</span>`:''}</div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm primary" id="refresh">↻ Update info</button>${canEdit?`<button class="btn sm" id="edit">Edit</button><button class="btn sm danger" id="del">Delete</button>`:''}</div>
      <div class="meta" id="meta">${st.computed_at?`Figures worked out ${when(st.computed_at)}`:''}${st.dld_last_fetch?` · DLD sales fetched ${when(st.dld_last_fetch)}`:''}${c.research_checked_on?` · Launch facts checked ${day(c.research_checked_on)}`:''}</div></div>
    <div class="facts six">
      ${fact('Launched',esc(c.launch_date))}
      ${fact('Handover',esc(c.handover_date))}
      ${fact('Units in your CRM',st.units_total?fmt(st.units_total):'',c.total_units?`Emaar total: ${fmt(c.total_units)}`:'')}
      ${fact('Layout types',layoutNames.length?`${layoutNames.length}`:'',layoutNames.length?esc(layoutNames.join(', ')):'')}
      ${fact('Bedroom types',beds.length?esc(beds.map(r=>r.b).join(', ')):'')}
      <div class="fact"><span>Owner records in your CRM</span><b id="crmCount">…</b></div>
    </div>
    ${lowCover?`<div class="section" style="padding-top:0"><div class="flag">Your CRM has ${fmt(st.units_total)} of ${fmt(c.total_units)} units here, so unit counts below may be low.</div></div>`:''}
    <div class="section"><h2>By bedroom type</h2>${beds.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Type</th><th>Units</th><th>BUA</th><th>Plot</th><th>Launch price</th><th>Current avg price</th><th>Since launch</th><th>Last 6 months</th></tr></thead><tbody>
      ${beds.map(r=>`<tr><td><b>${esc(r.b)} BR</b></td><td>${r.units?fmt(r.units):na}</td>
        <td>${r.bua?`${sq(r.bua[0],r.bua[1])}<span class="sub">${r.bua[2]}</span>`:na}</td>
        <td>${r.plot?`${sq(r.plot[0],r.plot[1])}<span class="sub">${r.plot[2]}</span>`:na}</td>
        <td>${r.launch?`<b>${aed(r.launch.v)}</b><span class="sub">${esc(r.launch.src)}</span>`:na}</td>
        <td>${r.m?`<b>${aed(r.m.avg)}</b><span class="sub">${short(r.m.min)} – ${short(r.m.max)}${r.m.psf?` · AED ${fmt(r.m.psf)}/sq ft`:''}</span><span class="sub">${r.m.sales} sale${r.m.sales>1?'s':''}, last ${r.m.months} months · latest ${day(r.m.last_date)}</span>`:'<span class="dim">No sales in 12 months</span>'}</td>
        <td>${signed(r.growth)}</td><td>${signed(r.trend)}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td>${fmt(tot)}${st.units_without_bedrooms?`<span class="sub">+${fmt(st.units_without_bedrooms)} without bedrooms</span>`:''}</td><td colspan="6"></td></tr>
      </tbody></table></div>`:'<div class="note">No bedroom data yet.</div>'}</div>
    <div class="section"><h2>By layout${layoutNames.length?` · ${layoutNames.length} layout type${layoutNames.length>1?'s':''}`:''}</h2>${lrows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Type</th><th>Layout</th><th>Units</th><th>BUA</th><th>Plot</th><th>Launch price</th><th>Current avg price</th></tr></thead><tbody>
      ${lrows.map(r=>{const dv=r.dev||{},cr=r.crm||{};const devBua=dv.bua_sqft||dv.bua_min_sqft?sq(dv.bua_min_sqft||dv.bua_sqft,dv.bua_max_sqft||dv.bua_sqft):'';
        const launch=dv.launch_price_aed||cr.first_min;
        return `<tr><td><b>${esc(r.b)} BR</b></td><td>${esc(r.name)}${dv.note?`<span class="sub">${esc(dv.note)}</span>`:''}</td>
        <td>${cr.units?`${fmt(cr.units)}<span class="tag">estimated</span>`:dv.units?`${fmt(dv.units)}<span class="sub">Emaar</span>`:na}</td>
        <td>${cr.bua_min?`${sq(cr.bua_min,cr.bua_max)}<span class="sub">CRM${devBua?` · Emaar plan ${devBua}`:''}</span>`:devBua?`${devBua}<span class="sub">Emaar plan</span>`:na}</td>
        <td>${cr.plot_min?`${sq(cr.plot_min,cr.plot_max)}<span class="sub">CRM</span>`:dv.plot_min_sqft?`${sq(dv.plot_min_sqft,dv.plot_max_sqft)}<span class="sub">Emaar plan</span>`:na}</td>
        <td>${launch?`<b>${aed(launch)}</b><span class="sub">${dv.launch_price_aed?'Published':'First recorded sales'}</span>`:na}</td>
        <td>${cr.market_avg?`<b>${aed(cr.market_avg)}</b><span class="sub">${cr.market_sales} sale${cr.market_sales>1?'s':''}, last 12 months</span>`:na}</td></tr>`;}).join('')}
      </tbody></table></div>${st.units_without_layout?`<div class="meta">${fmt(st.units_without_layout)} unit${st.units_without_layout>1?'s':''} not matched to a layout yet (no BUA in your CRM, or layouts share the same size).</div>`:''}`:'<div class="note">No layouts recorded yet.</div>'}</div>
    ${c.payment_plan?`<div class="section"><h2>Payment plan</h2><div class="note" style="white-space:pre-line">${esc(c.payment_plan)}</div></div>`:''}
    ${c.original_price_note?`<div class="section"><h2>Price note</h2><div class="note">${esc(c.original_price_note)}</div></div>`:''}
    <div class="section"><h2>Sources</h2>${(c.sources||[]).length?`<ul class="src">${c.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a><small>${esc((s.fields||[]).join(', '))}${s.checked?` · checked ${esc(s.checked)}`:''}</small></li>`).join('')}</ul>`:'<div class="note">No sources recorded.</div>'}
      ${c.open_questions?`<div class="note" style="margin-top:10px">${esc(c.open_questions)}</div>`:''}</div>`;
  $('refresh').onclick=()=>refresh(c);
  if(canEdit){$('edit').onclick=()=>editor(c);$('del').onclick=()=>remove(c);}
  db.from('owners').select('id',{count:'exact',head:true}).eq('community',c.community).eq('cluster',c.name).then(({count})=>{const el=$('crmCount');if(el)el.textContent=count==null?'—':fmt(count);});
}

async function refresh(c){
  const b=$('refresh');b.disabled=true;b.textContent='Updating… (up to a minute)';
  try{
    const r=await api('refreshCluster',{id:c.id});cache[c.id]=r.cluster;
    if(activeId===c.id){render(r.cluster);
      const note=r.dld?.skipped?'DLD was already fetched in the last hour':r.dld?.error?'DLD fetch failed: '+r.dld.error:r.dld?.mapped!=null?`${fmt(r.dld.mapped)} new DLD sales checked`:'';
      if(note)$('meta').textContent+=' · '+note;}
  }catch(e){b.disabled=false;b.textContent='↻ Update info';alert(e.message);}
}

async function remove(c){
  const b=$('del');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Click again to delete';return;}
  try{await api('deleteCluster',{id:c.id});delete cache[c.id];activeId=null;await load();$('detail').innerHTML='<div class="empty"><div><b>Deleted</b></div></div>';}catch(e){alert(e.message);}
}

function editor(c={}){
  // Layouts: one row per bedroom × layout (researched); launch prices: one row per bedroom type (published only).
  const lay=(c.layouts&&c.layouts.length?c.layouts:[{bedrooms:'',name:''}]).map(m=>({...m}));
  const lp=(c.launch_prices||[]).map(m=>({...m}));
  const w=document.createElement('div');w.className='scrim';
  const num=(m,k)=>`<td><input data-k="${k}" type="number" value="${m[k]||''}"></td>`;
  const lrow=(m,i)=>`<tr data-i="${i}"><td><input data-k="bedrooms" value="${esc(m.bedrooms||'')}" placeholder="4"></td><td><input data-k="name" value="${esc(m.name||'')}" placeholder="Earth"></td>
    ${num(m,'bua_sqft')}${num(m,'plot_min_sqft')}${num(m,'plot_max_sqft')}${num(m,'units')}${num(m,'launch_price_aed')}<td><input data-k="note" value="${esc(m.note||'')}"></td><td><button type="button" class="btn sm" data-rm>×</button></td></tr>`;
  const prow=(m,i)=>`<tr data-i="${i}"><td><input data-k="bedrooms" value="${esc(m.bedrooms||'')}" placeholder="4"></td>${num(m,'aed')}<td><input data-k="source" value="${esc(m.source||'')}" placeholder="Emaar launch, Jan 2025"></td><td><input data-k="url" value="${esc(m.url||'')}" placeholder="https://"></td><td><button type="button" class="btn sm" data-rm>×</button></td></tr>`;
  w.innerHTML=`<form class="modal"><header><h2>${c.id?'Edit '+esc(c.name):'Add cluster'}</h2><button type="button" class="btn sm" data-close>Close</button></header><div class="body">
    <div class="grid2"><label>Cluster<input name="name" value="${esc(c.name||'')}" required></label><label>Community<input name="community" value="${esc(c.community||'')}"></label>
    <label>Developer<input name="developer" value="${esc(c.developer||'')}"></label><label>Property type<input name="development_type" value="${esc(c.development_type||'')}"></label>
    <label>Launched (shown)<input name="launch_date" value="${esc(c.launch_date||'')}" placeholder="Jan 2025"></label><label>Launch date (for first-sales price)<input name="launch_on" type="date" value="${esc(c.launch_on||'')}"></label>
    <label>Handover<input name="handover_date" value="${esc(c.handover_date||'')}"></label><label>Total units (Emaar)<input name="total_units" type="number" value="${c.total_units||''}"></label>
    <label>Design styles<input name="usp" value="${esc(c.usp||'')}"></label></div>
    <label>Price note<input name="original_price_note" value="${esc(c.original_price_note||'')}"></label>
    <label>Payment plan<textarea name="payment_plan">${esc(c.payment_plan||'')}</textarea></label>
    <div><label style="margin-bottom:6px">Layouts (one row per bedroom type and layout)</label><table class="mix" data-t="lay"><thead><tr><th>Beds</th><th>Layout</th><th>BUA</th><th>Plot min</th><th>Plot max</th><th>Units</th><th>Launch AED</th><th>Note</th><th></th></tr></thead><tbody></tbody></table>
    <button type="button" class="btn sm" data-add="lay" style="margin-top:8px">+ Add layout</button></div>
    <div><label style="margin-bottom:6px">Published launch prices (leave empty to use first recorded sales)</label><table class="mix" data-t="lp"><thead><tr><th>Beds</th><th>From AED</th><th>Source</th><th>Link</th><th></th></tr></thead><tbody></tbody></table>
    <button type="button" class="btn sm" data-add="lp" style="margin-top:8px">+ Add launch price</button></div>
    <label>Open questions / unverified<textarea name="open_questions">${esc(c.open_questions||'')}</textarea></label></div>
    <footer><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button></footer></form>`;
  document.body.append(w);
  const f=w.querySelector('form');
  const tables={lay:{rows:lay,row:lrow,blank:{bedrooms:'',name:''}},lp:{rows:lp,row:prow,blank:{bedrooms:'',aed:0}}};
  const sync=t=>w.querySelectorAll(`[data-t="${t}"] tbody tr`).forEach(tr=>{const m=tables[t].rows[tr.dataset.i];tr.querySelectorAll('[data-k]').forEach(inp=>{m[inp.dataset.k]=inp.type==='number'?Number(inp.value||0):inp.value.trim();});});
  const redraw=t=>{const tb=w.querySelector(`[data-t="${t}"] tbody`);tb.innerHTML=tables[t].rows.map(tables[t].row).join('');
    tb.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{sync(t);tables[t].rows.splice(b.closest('tr').dataset.i,1);redraw(t);});};
  redraw('lay');redraw('lp');
  w.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const t=b.dataset.add;sync(t);tables[t].rows.push({...tables[t].blank});redraw(t);});
  w.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>w.remove());
  f.onsubmit=async e=>{e.preventDefault();sync('lay');sync('lp');
    const fd=Object.fromEntries(new FormData(f));
    try{const {cluster}=await api('saveCluster',{cluster:{...c,...fd,total_units:Number(fd.total_units||0),layouts:lay.filter(m=>m.bedrooms||m.name),launch_prices:lp.filter(m=>m.bedrooms&&m.aed)}});
      w.remove();delete cache[cluster.id];await load();open(cluster.id);}
    catch(err){alert(err.message);}};
}

async function load(){
  try{const r=await api('listClusters');clusters=r.clusters||[];canEdit=!!r.canEdit;}
  catch(e){$('list').innerHTML=`<div class="err">${esc(e.message)}</div>`;return;}
  $('add').hidden=!canEdit;
  const sel=$('community'),cur=sel.value;
  sel.innerHTML='<option value="">All communities</option>'+[...new Set(clusters.map(c=>c.community))].sort(byName).map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('');
  renderList();
}
$('q').oninput=renderList;$('community').onchange=renderList;$('add').onclick=()=>editor({});
$('theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';if(light)document.documentElement.dataset.theme='light';else delete document.documentElement.dataset.theme;try{localStorage.setItem('crm_theme',light?'light':'dark')}catch(e){}};
load().then(()=>{const id=location.hash.slice(1);if(id&&clusters.some(c=>c.id===id))open(id);else if(clusters[0])open([...clusters].sort((a,b)=>byName(a.community,b.community)||byName(a.name,b.name))[0].id);});
</script>
</body>
</html>
