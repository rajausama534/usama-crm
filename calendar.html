<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Usama CRM Calendar</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#03070d;--panel:#07101a;--line:#1c2a3a;--muted:#91a0b5;--text:#f7f9fc;--blue:#1687df;--green:#16b59b;--red:#ff6570}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,sans-serif;padding:18px}.wrap{max-width:1780px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;margin-bottom:16px}.top h1{margin:0;font-size:28px}.top p{margin:4px 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,button{font:inherit;color:#fff;background:#0a111d;border:1px solid #25364a;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;text-decoration:none}.primary{background:linear-gradient(135deg,#1687df,#12a9ad);border:0}.danger{color:#ffc2c7;border-color:#6d2931}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px}.panel{background:#050a11;border:1px solid var(--line);border-radius:14px;overflow:hidden}.calHead,.sideTitle{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-weight:700}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week div{height:44px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;background:#07111d;border-right:1px solid var(--line)}.day{height:128px;min-height:128px;padding:8px;border-top:1px solid #111c2b;border-right:1px solid #111c2b;background:#03070d;overflow:hidden}.day.other{opacity:.35}.day.today{box-shadow:inset 0 0 0 2px var(--blue);background:#06101b}.num{font-size:12px;font-weight:700;margin-bottom:6px;color:#fff}.event{display:block;width:100%;height:29px;text-align:left;margin:4px 0;padding:5px 8px;border-radius:7px;background:#071a39;border:0;border-left:3px solid #19a7ff;color:#fff;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.owner{background:#06251f;border-left-color:var(--green)}.event.manual{background:#251845;border-left-color:#8b5cf6}.more{font-size:11px;color:#7dd3fc;margin-top:5px;font-weight:700;cursor:pointer}.upcoming{max-height:780px;overflow:auto}.upItem{padding:13px 15px;border-bottom:1px solid #111c2b;cursor:pointer}.upItem:hover{background:#07111b}.upDate{font-size:11px;color:#38bdf8;font-weight:700}.upName{font-size:13px;font-weight:700;margin-top:4px}.upSub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}.empty{padding:28px;color:var(--muted);text-align:center}.back{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.back.show{display:flex}.modal{width:min(900px,96vw);max-height:92vh;overflow:auto;background:#08111f;border:1px solid #2a3b52;border-radius:20px}.modalHead{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #26364a}.modalHead h2{margin:0;font-size:25px}.close{font-size:24px;color:#ff8a8a}.form{padding:22px 24px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin-bottom:18px}.field label{display:block;color:#9eacc1;font-size:13px;font-weight:700;margin-bottom:8px}.field input,.field select{width:100%;height:52px;padding:0 14px;background:#050b13;color:#fff;border:1px solid #2a3d55;border-radius:12px;font:inherit}.search{position:relative}.results{position:absolute;left:0;right:0;top:81px;background:#111820;border:1px solid #42516a;border-radius:12px;max-height:260px;overflow:auto;display:none;z-index:80}.results.show{display:block}.result{padding:11px 13px;cursor:pointer;border-bottom:1px solid #263342}.result:hover{background:#1d3a5d}.muted{font-size:11px;color:var(--muted)}.footer{display:flex;gap:10px}.hidden{display:none!important}@media(max-width:950px){body{padding:10px}.layout{grid-template-columns:1fr}.top{flex-direction:column}.actions{width:100%}.actions>*{flex:1;text-align:center}.day{height:100px;min-height:100px;padding:5px}.event{height:25px;font-size:9px;padding:4px 5px}.week div{height:38px;font-size:10px}.two{grid-template-columns:1fr}.upcoming{max-height:340px}}</style></head><body><div class="wrap"><div class="top"><div><h1>Calendar</h1><p>Meetings, calls, viewings and follow-ups</p></div><div class="actions"><a class="btn" href="/?v=20260722">Back to CRM</a><button class="primary" onclick="openCreate()">+ Create Event</button><button onclick="goToday()">Today</button><button onclick="move(-1)">←</button><button onclick="move(1)">→</button></div></div><div class="layout"><section class="panel"><div class="calHead"><span id="monthTitle"></span><button onclick="loadCalendar()">Refresh</button></div><div class="week"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div><div id="grid" class="grid"><div class="empty">Loading…</div></div></section><aside class="panel"><div class="sideTitle">Upcoming Events</div><div id="upcoming" class="upcoming"><div class="empty">Loading…</div></div></aside></div></div><div id="back" class="back"><div class="modal"><div class="modalHead"><h2 id="modalTitle">Create Event</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="two"><div class="field"><label>Event Type</label><select id="type"><option>Meeting</option><option>Call</option><option>Viewing</option><option>Follow-up</option><option>Task</option><option>Other</option></select></div><div class="field"><label>Participant Source</label><select id="source" onchange="sourceChanged()"><option value="lead">Lead</option><option value="owner">Owner</option><option value="manual">Manual name</option></select></div></div><div id="searchWrap" class="field search"><label>Search Participant</label><input id="searchInput" autocomplete="off" placeholder="Type name, project, cluster or unit" oninput="searchPeople()"><div id="results" class="results"></div></div><div id="manualWrap" class="field hidden"><label>Person Name</label><input id="manualName" placeholder="Enter person name"></div><input id="personId" type="hidden"><div class="two"><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Time</label><input id="time" type="time"></div></div><div class="field"><label>Title / Subject</label><input id="title" placeholder="Meeting subject"></div><div class="field"><label>Meeting Location</label><input id="location" placeholder="Office, community, Zoom, Google Meet or address"></div><div class="footer"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveEvent()">Save Event</button><button id="deleteBtn" class="danger hidden" onclick="deleteEvent()">Delete</button></div></div></div></div><script>const db=supabase.createClient('https://vnydxkmhrcesdffpfjpc.supabase.co','sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I');let cursor=new Date();cursor.setDate(1);let events=[],editing=null,rows=[];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;function startGrid(d){const x=new Date(d.getFullYear(),d.getMonth(),1);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x}function endGrid(d){const x=startGrid(d);x.setDate(x.getDate()+41);x.setHours(23,59,59,999);return x}function fmtTime(v){return new Date(v).toLocaleTimeString('en-AE',{hour:'2-digit',minute:'2-digit',hour12:true})}function fmtDate(v){return new Date(v).toLocaleDateString('en-AE',{weekday:'short',day:'numeric',month:'short'})}function goToday(){cursor=new Date();cursor.setDate(1);loadCalendar()}function move(n){cursor.setMonth(cursor.getMonth()+n);loadCalendar()}async function loadCalendar(){document.getElementById('monthTitle').textContent=cursor.toLocaleDateString('en-AE',{month:'long',year:'numeric'});const s=startGrid(cursor),e=endGrid(cursor);const [or,lr]=await Promise.all([db.from('owner_activities').select('*').gte('created_at',s.toISOString()).lte('created_at',e.toISOString()).like('activity_type','Scheduled:%').order('created_at'),db.from('lead_activities').select('*').gte('created_at',s.toISOString()).lte('created_at',e.toISOString()).like('activity_type','Scheduled:%').order('created_at')]);if(or.error||lr.error){document.getElementById('grid').innerHTML=`<div class="empty">${esc(or.error?.message||lr.error?.message)}</div>`;return}const oa=or.data||[],la=lr.data||[],oids=[...new Set(oa.map(x=>x.owner_id).filter(Boolean))],lids=[...new Set(la.map(x=>x.lead_id).filter(Boolean))];const [om,lm]=await Promise.all([oids.length?db.from('owners').select('id,owner,community,cluster,unit').in('id',oids):Promise.resolve({data:[]}),lids.length?db.from('leads').select('id,name,project_inquired').in('id',lids):Promise.resolve({data:[]})]);const oMap=Object.fromEntries((om.data||[]).map(x=>[String(x.id),x])),lMap=Object.fromEntries((lm.data||[]).map(x=>[String(x.id),x]));events=[...oa.map(a=>{const o=oMap[String(a.owner_id)]||{};return{id:a.id,table:'owner_activities',personId:a.owner_id,when:a.created_at,kind:'owner',name:o.owner||'Owner',sub:[o.community,o.cluster,o.unit?`Unit ${o.unit}`:''].filter(Boolean).join(' · '),type:String(a.activity_type||'').replace('Scheduled: ','')||'Event',location:a.details||''}}),...la.map(a=>{const l=lMap[String(a.lead_id)]||{};return{id:a.id,table:'lead_activities',personId:a.lead_id,when:a.created_at,kind:'lead',name:l.name||'Lead',sub:l.project_inquired||'',type:String(a.activity_type||'').replace('Scheduled: ','')||'Event',location:a.details||''}})].sort((a,b)=>new Date(a.when)-new Date(b.when));events.forEach((e,i)=>e.index=i);render(s)}function render(start){const by={};events.forEach(e=>(by[key(new Date(e.when))]??=[]).push(e));let html='',d=new Date(start),today=key(new Date());for(let i=0;i<42;i++){const k=key(d),list=by[k]||[],other=d.getMonth()!==cursor.getMonth();html+=`<div class="day ${other?'other':''} ${k===today?'today':''}" ondblclick="openCreate('${k}')"><div class="num">${d.getDate()}</div>${list.slice(0,2).map(e=>`<button class="event ${e.kind}" onclick="openEdit(${e.index})"><b>${esc(fmtTime(e.when))}</b> ${esc(e.type)} · ${esc(e.name)}</button>`).join('')}${list.length>2?`<div class="more" onclick="showDay('${k}')">+${list.length-2} more</div>`:''}</div>`;d.setDate(d.getDate()+1)}document.getElementById('grid').innerHTML=html;const up=events.filter(e=>new Date(e.when)>=new Date()).slice(0,40);document.getElementById('upcoming').innerHTML=up.length?up.map(e=>`<div class="upItem" onclick="openEdit(${e.index})"><div class="upDate">${esc(fmtDate(e.when))} · ${esc(fmtTime(e.when))}</div><div class="upName">${esc(e.type)} — ${esc(e.name)}</div><div class="upSub">${esc(e.sub)}${e.location?`<br>📍 ${esc(e.location)}`:''}</div></div>`).join(''):'<div class="empty">No upcoming events</div>'}function showDay(k){const list=events.filter(e=>key(new Date(e.when))===k);document.getElementById('upcoming').innerHTML=list.map(e=>`<div class="upItem" onclick="openEdit(${e.index})"><div class="upDate">${esc(fmtTime(e.when))}</div><div class="upName">${esc(e.type)} — ${esc(e.name)}</div><div class="upSub">${esc(e.sub)}${e.location?`<br>📍 ${esc(e.location)}`:''}</div></div>`).join('')}function openCreate(k=''){editing=null;document.getElementById('modalTitle').textContent='Create Event';document.getElementById('deleteBtn').classList.add('hidden');document.getElementById('type').value='Meeting';document.getElementById('source').value='lead';document.getElementById('searchInput').value='';document.getElementById('manualName').value='';document.getElementById('personId').value='';document.getElementById('date').value=k||key(new Date());document.getElementById('time').value='09:00';document.getElementById('title').value='';document.getElementById('location').value='';sourceChanged();document.getElementById('back').classList.add('show')}function openEdit(i){const e=events[i];editing=e;document.getElementById('modalTitle').textContent='Edit Event';document.getElementById('deleteBtn').classList.remove('hidden');document.getElementById('type').value=e.type;document.getElementById('source').value=e.kind;document.getElementById('searchInput').value=e.name;document.getElementById('manualName').value=e.name;document.getElementById('personId').value=e.personId||'';const d=new Date(e.when);document.getElementById('date').value=key(d);document.getElementById('time').value=`${pad(d.getHours())}:${pad(d.getMinutes())}`;document.getElementById('title').value=e.type;document.getElementById('location').value=e.location||'';sourceChanged(false);document.getElementById('back').classList.add('show')}function closeModal(){document.getElementById('back').classList.remove('show');document.getElementById('results').classList.remove('show')}function sourceChanged(clear=true){const s=document.getElementById('source').value;document.getElementById('searchWrap').classList.toggle('hidden',s==='manual');document.getElementById('manualWrap').classList.toggle('hidden',s!=='manual');if(clear){document.getElementById('searchInput').value='';document.getElementById('personId').value=''}rows=[]}async function searchPeople(){const term=document.getElementById('searchInput').value.trim(),box=document.getElementById('results');if(term.length<2){box.classList.remove('show');return}const src=document.getElementById('source').value;let r;if(src==='lead')r=await db.from('leads').select('id,name,project_inquired').or(`name.ilike.%${term}%,project_inquired.ilike.%${term}%`).limit(20);else r=await db.from('owners').select('id,owner,community,cluster,unit').or(`owner.ilike.%${term}%,community.ilike.%${term}%,cluster.ilike.%${term}%,unit.ilike.%${term}%`).limit(20);rows=r.data||[];box.innerHTML=rows.map((x,i)=>`<div class="result" onclick="pick(${i})"><b>${esc(src==='lead'?x.name:x.owner)}</b><div class="muted">${esc(src==='lead'?(x.project_inquired||''):[x.community,x.cluster,x.unit?`Unit ${x.unit}`:''].filter(Boolean).join(' · '))}</div></div>`).join('')||'<div class="result">No matches</div>';box.classList.add('show')}function pick(i){const src=document.getElementById('source').value,r=rows[i];document.getElementById('personId').value=r.id;document.getElementById('searchInput').value=src==='lead'?r.name:r.owner;document.getElementById('results').classList.remove('show')}async function saveEvent(){const src=document.getElementById('source').value,id=document.getElementById('personId').value,name=src==='manual'?document.getElementById('manualName').value.trim():document.getElementById('searchInput').value.trim(),type=document.getElementById('type').value,date=document.getElementById('date').value,time=document.getElementById('time').value,location=document.getElementById('location').value.trim();if(!name||!date||!time){alert('Participant, date and time are required');return}if(src!=='manual'&&!id){alert('Choose a participant from the search results');return}const when=new Date(`${date}T${time}:00`).toISOString(),table=src==='owner'?'owner_activities':'lead_activities',payload={activity_type:`Scheduled: ${type}`,details:location,created_at:when};if(src==='owner')payload.owner_id=id;else payload.lead_id=id||null;if(editing){if(editing.table===table){const {error}=await db.from(table).update(payload).eq('id',editing.id);if(error){alert(error.message);return}}else{await db.from(editing.table).delete().eq('id',editing.id);const {error}=await db.from(table).insert(payload);if(error){alert(error.message);return}}}else{const {error}=await db.from(table).insert(payload);if(error){alert(error.message);return}}closeModal();loadCalendar()}async function deleteEvent(){if(!editing||!confirm('Delete this event?'))return;const {error}=await db.from(editing.table).delete().eq('id',editing.id);if(error){alert(error.message);return}closeModal();loadCalendar()}loadCalendar();</script></body></html>
