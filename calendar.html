<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usama CRM Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#03070d;--panel:#07101a;--panel2:#0a1420;--line:#1c2a3a;--muted:#8fa0b6;--text:#f4f7fb;--blue:#1687df;--blue2:#0d6fc1;--green:#16b59b;--purple:#7c4dff;--red:#ff5d68}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#071725 0,#03070d 42%);color:var(--text);font-family:Poppins,sans-serif;padding:20px}.wrap{max-width:1780px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}.title h1{margin:0;font-size:28px;letter-spacing:-.5px}.title p{margin:5px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn,button{font:inherit;color:#fff;background:#0b1521;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;text-decoration:none;transition:.18s}.btn:hover,button:hover{border-color:#31506e;background:#0f1d2c}.primary{background:linear-gradient(135deg,var(--blue),#0f9fb4);border:0;box-shadow:0 8px 24px rgba(22,135,223,.22)}.danger{color:#ffb4ba;border-color:#63303a;background:#211016}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:15px}.panel{background:rgba(7,16,26,.94);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.28)}.calHead{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}#monthTitle{font-size:19px;font-weight:700}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week div{padding:11px 6px;text-align:center;color:var(--muted);font-size:11px;font-weight:700;border-right:1px solid rgba(148,163,184,.09);letter-spacing:.4px}.day{min-height:132px;padding:8px;border-top:1px solid rgba(148,163,184,.09);border-right:1px solid rgba(148,163,184,.09);background:#050b12}.day:hover{background:#07101a}.day.other{opacity:.34}.day.today{box-shadow:inset 0 0 0 2px var(--blue);background:#071321}.num{font-size:12px;font-weight:700;margin-bottom:7px}.event{display:block;width:100%;text-align:left;margin:4px 0;padding:6px 7px;border-radius:7px;background:rgba(22,135,223,.16);border:0;border-left:3px solid var(--blue);font-size:10.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.event.owner{background:rgba(22,181,155,.13);border-left-color:var(--green)}.event.manual{background:rgba(124,77,255,.14);border-left-color:var(--purple)}.more{font-size:10px;color:#8ec9ff;margin-top:5px}.sideTitle{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid var(--line);font-weight:700}.upcoming{max-height:790px;overflow:auto}.upItem{padding:13px 15px;border-bottom:1px solid rgba(148,163,184,.1);cursor:pointer}.upItem:hover{background:#0a1420}.upDate{font-size:10.5px;color:#45aaf2;font-weight:700}.upName{font-size:13px;font-weight:700;margin-top:4px}.upSub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}.empty,.loading{padding:26px;color:var(--muted);text-align:center}.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}.modalBack.show{display:flex}.modal{width:min(620px,96vw);max-height:92vh;overflow:auto;background:#08111b;border:1px solid #29405a;border-radius:16px;box-shadow:0 30px 100px rgba(0,0,0,.55)}.modalHead{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.modalHead h2{margin:0;font-size:20px}.close{width:36px;height:36px;padding:0;border-radius:9px;color:#ff8f98}.form{padding:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:13px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#050b12;color:#fff;border:1px solid #25364a;border-radius:10px;padding:11px 12px;font:inherit;font-size:13px;outline:none}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}.modalActions{display:flex;justify-content:space-between;gap:10px;margin-top:8px}.modalActions .right{display:flex;gap:9px}.hidden{display:none!important}.hint{font-size:10px;color:#6f8299;margin-top:5px}.toast{position:fixed;right:18px;bottom:18px;background:#0d1a27;border:1px solid #29415a;padding:11px 15px;border-radius:10px;display:none;z-index:10000}.toast.show{display:block}@media(max-width:980px){.layout{grid-template-columns:1fr}.upcoming{max-height:430px}}@media(max-width:700px){body{padding:10px}.top{flex-direction:column}.actions{width:100%}.actions .primary{flex:1}.day{min-height:92px;padding:5px}.event{font-size:9px;padding:4px 5px}.week div{font-size:9px;padding:8px 1px}.row{grid-template-columns:1fr}.title h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title"><h1>Calendar</h1><p>Meetings, calls, viewings and follow-ups</p></div>
    <div class="actions"><a class="btn" href="/">Back to CRM</a><button class="primary" onclick="openCreate()">+ Create Event</button><button onclick="goToday()">Today</button><button onclick="changeMonth(-1)">←</button><button onclick="changeMonth(1)">→</button></div>
  </div>
  <div class="layout">
    <section class="panel"><div class="calHead"><span id="monthTitle"></span><button onclick="loadCalendar()">Refresh</button></div><div class="week"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div><div id="calendarGrid" class="grid"><div class="loading">Loading…</div></div></section>
    <aside class="panel"><div class="sideTitle"><span>Upcoming Events</span><button class="primary" onclick="openCreate()">Add</button></div><div id="upcoming" class="upcoming"><div class="loading">Loading…</div></div></aside>
  </div>
</div>
<div id="modalBack" class="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalHead"><h2 id="modalTitle">Create Event</h2><button class="close" onclick="closeModal()">✕</button></div><div class="form">
<input type="hidden" id="eventId"><input type="hidden" id="eventTable"><input type="hidden" id="eventKind">
<div class="row"><div class="field"><label>Event Type</label><select id="eventType"><option>Meeting</option><option>Viewing</option><option>Call</option><option>Follow-up</option><option>Task</option><option>Other</option></select></div><div class="field"><label>Participant Source</label><select id="participantSource" onchange="toggleParticipantFields()"><option value="lead">Lead</option><option value="owner">Owner</option><option value="manual">Manual name</option></select></div></div>
<div id="participantSelectWrap" class="field"><label>Participant</label><select id="participantSelect"></select><div class="hint">Choose an existing lead or owner.</div></div>
<div id="manualWrap" class="field hidden"><label>Person Name</label><input id="manualName" placeholder="Type participant name"></div>
<div class="row"><div class="field"><label>Date</label><input id="eventDate" type="date"></div><div class="field"><label>Time</label><input id="eventTime" type="time"></div></div>
<div class="field"><label>Title / Subject</label><input id="eventTitle" placeholder="Example: Farm Gardens viewing"></div>
<div class="field"><label>Notes</label><textarea id="eventDetails" placeholder="Add agenda, location or discussion notes"></textarea></div>
<div class="modalActions"><button id="deleteBtn" class="danger hidden" onclick="deleteEvent()">Delete Event</button><div class="right"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveEvent()">Save Event</button></div></div>
</div></div></div>
<div id="toast" class="toast"></div>
<script>
const db=supabase.createClient('https://vnydxkmhrcesdffpfjpc.supabase.co','sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I');
let viewDate=new Date();viewDate.setDate(1);let events=[];let leadsCache=[];let ownersCache=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}function goToday(){viewDate=new Date();viewDate.setDate(1);loadCalendar()}function changeMonth(n){viewDate.setMonth(viewDate.getMonth()+n);loadCalendar()}function startOfGrid(d){const x=new Date(d.getFullYear(),d.getMonth(),1),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}function endOfGrid(d){const x=startOfGrid(d);x.setDate(x.getDate()+41);x.setHours(23,59,59,999);return x}function fmtTime(v){return new Date(v).toLocaleTimeString('en-AE',{hour:'2-digit',minute:'2-digit',hour12:true})}function fmtDate(v){return new Date(v).toLocaleDateString('en-AE',{weekday:'short',day:'numeric',month:'short'})}
function manualEvents(){try{return JSON.parse(localStorage.getItem('usama_crm_manual_events')||'[]')}catch{return[]}}function saveManualEvents(rows){localStorage.setItem('usama_crm_manual_events',JSON.stringify(rows))}
async function loadPeople(){const [l,o]=await Promise.all([db.from('leads').select('id,name,project_inquired').order('name').limit(2000),db.from('owners').select('id,owner,community,cluster,unit').order('owner').limit(3000)]);leadsCache=l.data||[];ownersCache=o.data||[];fillParticipants()}
function fillParticipants(){const source=document.getElementById('participantSource').value,sel=document.getElementById('participantSelect');const rows=source==='owner'?ownersCache:leadsCache;sel.innerHTML=rows.map(r=>`<option value="${r.id}">${esc(source==='owner'?`${r.owner||'Owner'} — ${r.community||''} ${r.cluster||''} ${r.unit?`Unit ${r.unit}`:''}`:`${r.name||'Lead'} — ${r.project_inquired||''}`)}</option>`).join('')||'<option value="">No records found</option>'}
function toggleParticipantFields(){const manual=document.getElementById('participantSource').value==='manual';document.getElementById('manualWrap').classList.toggle('hidden',!manual);document.getElementById('participantSelectWrap').classList.toggle('hidden',manual);if(!manual)fillParticipants()}
function openCreate(date=''){document.getElementById('modalTitle').textContent='Create Event';['eventId','eventTable','eventKind'].forEach(id=>document.getElementById(id).value='');document.getElementById('deleteBtn').classList.add('hidden');document.getElementById('eventType').value='Meeting';document.getElementById('participantSource').value='lead';document.getElementById('manualName').value='';document.getElementById('eventDate').value=date||key(new Date());document.getElementById('eventTime').value='10:00';document.getElementById('eventTitle').value='';document.getElementById('eventDetails').value='';toggleParticipantFields();document.getElementById('modalBack').classList.add('show')}
function openEdit(i){const e=events[i];document.getElementById('modalTitle').textContent='Edit Event';document.getElementById('eventId').value=e.id||'';document.getElementById('eventTable').value=e.table||'';document.getElementById('eventKind').value=e.kind||'';document.getElementById('eventType').value=e.type||'Meeting';document.getElementById('participantSource').value=e.kind==='manual'?'manual':e.kind;toggleParticipantFields();if(e.kind==='manual')document.getElementById('manualName').value=e.name||'';else document.getElementById('participantSelect').value=String(e.personId||'');const d=new Date(e.when);document.getElementById('eventDate').value=key(d);document.getElementById('eventTime').value=`${pad(d.getHours())}:${pad(d.getMinutes())}`;document.getElementById('eventTitle').value=e.title||'';document.getElementById('eventDetails').value=e.details||'';document.getElementById('deleteBtn').classList.remove('hidden');document.getElementById('modalBack').classList.add('show')}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
async function saveEvent(){const id=document.getElementById('eventId').value,table=document.getElementById('eventTable').value,source=document.getElementById('participantSource').value,type=document.getElementById('eventType').value,date=document.getElementById('eventDate').value,time=document.getElementById('eventTime').value,title=document.getElementById('eventTitle').value.trim(),details=document.getElementById('eventDetails').value.trim();if(!date||!time){alert('Select date and time');return}const when=new Date(`${date}T${time}:00`).toISOString();const combined=title?`${title}${details?`\n${details}`:''}`:details;
 if(id&&table==='manual'){let rows=manualEvents();rows=rows.map(x=>String(x.id)===String(id)?{...x,type,name:document.getElementById('manualName').value.trim()||'Manual participant',title,details,when}:x);saveManualEvents(rows)}
 else if(id){const {error}=await db.from(table).update({activity_type:`Scheduled: ${type}`,details:combined,created_at:when}).eq('id',id);if(error){alert(error.message);return}}
 else if(source==='manual'){const name=document.getElementById('manualName').value.trim();if(!name){alert('Enter participant name');return}const rows=manualEvents();rows.push({id:`m_${Date.now()}`,kind:'manual',table:'manual',type,name,title,details,when});saveManualEvents(rows)}
 else {const personId=document.getElementById('participantSelect').value;if(!personId){alert('Select a participant');return}const target=source==='owner'?'owner_activities':'lead_activities';const payload={activity_type:`Scheduled: ${type}`,details:combined,created_at:when};payload[source==='owner'?'owner_id':'lead_id']=personId;const {error}=await db.from(target).insert(payload);if(error){alert(error.message);return}}
 closeModal();toast('Event saved');loadCalendar()}
async function deleteEvent(){const id=document.getElementById('eventId').value,table=document.getElementById('eventTable').value;if(!confirm('Delete this event?'))return;if(table==='manual'){saveManualEvents(manualEvents().filter(x=>String(x.id)!==String(id)))}else{const {error}=await db.from(table).delete().eq('id',id);if(error){alert(error.message);return}}closeModal();toast('Event deleted');loadCalendar()}
async function loadCalendar(){document.getElementById('monthTitle').textContent=viewDate.toLocaleDateString('en-AE',{month:'long',year:'numeric'});const start=startOfGrid(viewDate),end=endOfGrid(viewDate);const [or,lr]=await Promise.all([db.from('owner_activities').select('*').gte('created_at',start.toISOString()).lte('created_at',end.toISOString()).like('activity_type','Scheduled:%').order('created_at'),db.from('lead_activities').select('*').gte('created_at',start.toISOString()).lte('created_at',end.toISOString()).like('activity_type','Scheduled:%').order('created_at')]);if(or.error||lr.error){document.getElementById('calendarGrid').innerHTML=`<div class="empty">${esc(or.error?.message||lr.error?.message)}</div>`;return}const ownerActs=or.data||[],leadActs=lr.data||[];const ownerIds=[...new Set(ownerActs.map(x=>x.owner_id).filter(Boolean))],leadIds=[...new Set(leadActs.map(x=>x.lead_id).filter(Boolean))];const [om,lm]=await Promise.all([ownerIds.length?db.from('owners').select('id,owner,community,cluster,unit').in('id',ownerIds):Promise.resolve({data:[]}),leadIds.length?db.from('leads').select('id,name,project_inquired').in('id',leadIds):Promise.resolve({data:[]})]);const ownerMap=Object.fromEntries((om.data||[]).map(x=>[String(x.id),x])),leadMap=Object.fromEntries((lm.data||[]).map(x=>[String(x.id),x]));events=[...ownerActs.map(a=>{const o=ownerMap[String(a.owner_id)]||{};const parts=String(a.details||'').split('\n');return{id:a.id,table:'owner_activities',personId:a.owner_id,when:a.created_at,kind:'owner',name:o.owner||'Owner',sub:`${o.community||''} ${o.cluster||''} ${o.unit?`· Unit ${o.unit}`:''}`,type:String(a.activity_type||'').replace('Scheduled: ','')||'Event',title:parts[0]||'',details:parts.slice(1).join('\n')}}),...leadActs.map(a=>{const l=leadMap[String(a.lead_id)]||{};const parts=String(a.details||'').split('\n');return{id:a.id,table:'lead_activities',personId:a.lead_id,when:a.created_at,kind:'lead',name:l.name||'Lead',sub:l.project_inquired||'',type:String(a.activity_type||'').replace('Scheduled: ','')||'Event',title:parts[0]||'',details:parts.slice(1).join('\n')}}),...manualEvents()].sort((a,b)=>new Date(a.when)-new Date(b.when));events.forEach((e,i)=>e.index=i);const byDay={};events.forEach(e=>(byDay[key(new Date(e.when))]??=[]).push(e));const todayKey=key(new Date());let html='',cursor=new Date(start);for(let i=0;i<42;i++){const k=key(cursor),items=byDay[k]||[],other=cursor.getMonth()!==viewDate.getMonth();html+=`<div class="day ${other?'other':''} ${k===todayKey?'today':''}" ondblclick="openCreate('${k}')"><div class="num">${cursor.getDate()}</div>${items.slice(0,4).map(e=>`<button class="event ${e.kind}" onclick="openEdit(${e.index})" title="Click to edit"><b>${esc(fmtTime(e.when))}</b> ${esc(e.type)} · ${esc(e.name)}</button>`).join('')}${items.length>4?`<div class="more">+${items.length-4} more</div>`:''}</div>`;cursor.setDate(cursor.getDate()+1)}document.getElementById('calendarGrid').innerHTML=html;const up=events.filter(e=>new Date(e.when)>=new Date()).slice(0,50);document.getElementById('upcoming').innerHTML=up.length?up.map(e=>`<div class="upItem" onclick="openEdit(${e.index})"><div class="upDate">${esc(fmtDate(e.when))} · ${esc(fmtTime(e.when))}</div><div class="upName">${esc(e.type)} — ${esc(e.name)}</div><div class="upSub">${esc(e.title||e.sub||'')}${e.details?`<br>${esc(e.details)}`:''}</div></div>`).join(''):'<div class="empty">No upcoming events</div>'}
loadPeople();loadCalendar();
</script>
</body></html>
