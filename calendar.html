<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Usama CRM Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#03070d;--panel:#07101a;--panel2:#050a11;--line:#1b2938;--line2:#111c29;--muted:#8fa0b5;--text:#f5f7fb;--blue:#1687df;--cyan:#18a7d8;--green:#16b59b;--red:#ff6570;--purple:#8b5cf6}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,sans-serif;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#02060b;flex:0 0 auto}.brand h1{margin:0;font-size:22px;letter-spacing:-.4px}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}.toolbar{display:flex;align-items:center;gap:7px}.btn,button{font:600 12px Poppins,sans-serif;color:#edf4ff;background:#08111c;border:1px solid #23364a;border-radius:8px;padding:8px 12px;text-decoration:none;cursor:pointer;white-space:nowrap}.btn:hover,button:hover{background:#0d1927;border-color:#365471}.primary{border:0;background:linear-gradient(135deg,#1687df,#14a8b3)}.navBtn{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:17px}.main{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px;padding:10px}.panel{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0}.calendarPanel{display:flex;flex-direction:column}.calHeader{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);flex:0 0 auto}.monthTitle{font-size:16px;font-weight:700}.monthActions{display:flex;gap:6px}.monthActions button{height:32px;padding:0 10px;font-size:11px}.week{height:38px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:0 0 auto;background:#08111c;border-bottom:1px solid var(--line)}.week div{display:flex;align-items:center;justify-content:center;color:#d9e2ee;font-size:10px;font-weight:700;border-right:1px solid var(--line)}.week div:last-child{border-right:0}.grid{min-height:0;flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr))}.day{position:relative;min-width:0;min-height:0;padding:6px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);background:#03070d;overflow:hidden}.day:nth-child(7n){border-right:0}.day.other{background:#02050a;opacity:.45}.day.today{background:#07111d;box-shadow:inset 0 0 0 2px var(--blue)}.num{font-size:10px;font-weight:700;color:#f5f7fb;margin-bottom:3px}.event{display:block;width:100%;height:23px;margin:3px 0 0;padding:3px 6px;border:0;border-left:3px solid #20a8ff;border-radius:5px;background:#071a39;color:#fff;text-align:left;font-size:9px;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.owner{background:#06251f;border-left-color:var(--green)}.event.manual{background:#251845;border-left-color:var(--purple)}.more{margin-top:3px;color:#6fd3ff;font-size:9px;font-weight:700;cursor:pointer}.side{display:flex;flex-direction:column}.sideTitle{height:48px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;flex:0 0 auto}.upcoming{min-height:0;overflow:auto}.upItem{padding:11px 13px;border-bottom:1px solid var(--line2);cursor:pointer}.upItem:hover{background:#08111c}.upDate{font-size:9px;color:#39c1ff;font-weight:700}.upName{font-size:11px;font-weight:700;margin-top:3px}.upSub{font-size:9px;color:var(--muted);margin-top:3px;line-height:1.45}.empty{padding:22px;text-align:center;color:var(--muted);font-size:11px}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.backdrop.show{display:flex}.modal{width:min(760px,96vw);max-height:90vh;overflow:auto;background:#08111f;border:1px solid #2a3b52;border-radius:16px}.modalHead{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #26364a}.modalHead h2{margin:0;font-size:20px}.close{width:36px;height:36px;padding:0;color:#ff8a8a;font-size:21px}.form{padding:18px 20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;color:#9eacc1;font-size:11px;font-weight:700}.field input,.field select{width:100%;height:44px;padding:0 12px;background:#050b13;color:#fff;border:1px solid #2a3d55;border-radius:9px;font:500 13px Poppins,sans-serif}.search{position:relative}.results{position:absolute;left:0;right:0;top:68px;max-height:210px;overflow:auto;display:none;background:#111820;border:1px solid #42516a;border-radius:9px;z-index:120}.results.show{display:block}.result{padding:9px 11px;border-bottom:1px solid #263342;cursor:pointer;font-size:12px}.result:hover{background:#1d3a5d}.muted{font-size:10px;color:var(--muted)}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}.footer button{height:40px}.danger{color:#ffc2c7;border-color:#6d2931}.hidden{display:none!important}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.topbar{height:auto;min-height:62px;padding:10px 12px;align-items:flex-start}.brand h1{font-size:20px}.toolbar{display:grid;grid-template-columns:auto auto auto 36px 36px;gap:5px}.toolbar .btn,.toolbar button{height:36px;padding:0 9px;font-size:10px}.main{display:block;padding:8px}.calendarPanel{height:calc(100vh - 86px)}.side{margin-top:8px;max-height:300px}.day{padding:4px}.num{font-size:9px}.event{height:20px;line-height:14px;font-size:7.5px;padding:3px 4px}.more{font-size:8px}.week{height:32px}.week div{font-size:8px}.calHeader{height:42px}.monthTitle{font-size:14px}}
@media(max-width:620px){.brand p{display:none}.topbar{display:block}.toolbar{margin-top:8px;grid-template-columns:1fr 1.1fr .9fr 36px 36px}.calendarPanel{height:620px}.main{padding:6px}.panel{border-radius:8px}.grid{grid-template-rows:repeat(6,1fr)}.day{min-height:0}.event{height:18px;line-height:12px}.side{max-height:240px}.backdrop{align-items:flex-end;padding:0}.modal{width:100%;max-height:92vh;border-radius:16px 16px 0 0}.modalHead{height:50px;padding:0 14px}.modalHead h2{font-size:18px}.form{padding:14px}.two{gap:9px}.field{margin-bottom:10px}.field input,.field select{height:42px;font-size:12px}.footer{position:sticky;bottom:0;background:#08111f;padding-top:8px}.footer button{flex:1}.search{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><h1>Calendar</h1><p>Meetings, calls, viewings and follow-ups</p></div>
    <div class="toolbar"><a class="btn" href="/?v=20260722">Back</a><button class="primary" onclick="openCreate()">+ Event</button><button onclick="goToday()">Today</button><button class="navBtn" onclick="move(-1)">←</button><button class="navBtn" onclick="move(1)">→</button></div>
  </header>
  <main class="main">
    <section class="panel calendarPanel">
      <div class="calHeader"><span id="monthTitle" class="monthTitle"></span><div class="monthActions"><button onclick="loadCalendar()">Refresh</button></div></div>
      <div class="week"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div>
      <div id="grid" class="grid"><div class="empty">Loading…</div></div>
    </section>
    <aside class="panel side"><div class="sideTitle">Upcoming Events</div><div id="upcoming" class="upcoming"><div class="empty">Loading…</div></div></aside>
  </main>
</div>
<div id="backdrop" class="backdrop"><div class="modal"><div class="modalHead"><h2 id="modalTitle">Create Event</h2><button class="close" onclick="closeModal()">×</button></div><div class="form">
  <div class="two"><div class="field"><label>Event Type</label><select id="type"><option>Meeting</option><option>Call</option><option>Viewing</option><option>Follow-up</option><option>Task</option><option>Other</option></select></div><div class="field"><label>Participant Source</label><select id="source" onchange="sourceChanged()"><option value="lead">Lead</option><option value="owner">Owner</option><option value="manual">Manual name</option></select></div></div>
  <div id="searchWrap" class="field search"><label>Search Participant</label><input id="searchInput" autocomplete="off" placeholder="Type name, project, cluster or unit" oninput="searchPeople()"><div id="results" class="results"></div></div>
  <div id="manualWrap" class="field hidden"><label>Person Name</label><input id="manualName" placeholder="Enter person name"></div><input id="personId" type="hidden">
  <div class="two"><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Time</label><input id="time" type="time"></div></div>
  <div class="field"><label>Title / Subject</label><input id="title" placeholder="Meeting subject"></div>
  <div class="field"><label>Meeting Location</label><input id="location" placeholder="Office, community, Zoom or address"></div>
  <div class="footer"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveEvent()">Save Event</button><button id="deleteBtn" class="danger hidden" onclick="deleteEvent()">Delete</button></div>
</div></div></div>
<script>
const db=supabase.createClient('https://vnydxkmhrcesdffpfjpc.supabase.co','sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I');
let cursor=new Date();cursor.setDate(1);let events=[],editing=null,rows=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function startGrid(d){const x=new Date(d.getFullYear(),d.getMonth(),1);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x}
function endGrid(d){const x=startGrid(d);x.setDate(x.getDate()+41);x.setHours(23,59,59,999);return x}
function fmtTime(v){return new Date(v).toLocaleTimeString('en-AE',{hour:'2-digit',minute:'2-digit',hour12:true})}
function fmtDate(v){return new Date(v).toLocaleDateString('en-AE',{weekday:'short',day:'numeric',month:'short'})}
function goToday(){cursor=new Date();cursor.setDate(1);loadCalendar()}function move(n){cursor.setMonth(cursor.getMonth()+n);loadCalendar()}
function manualEvents(){try{return JSON.parse(localStorage.getItem('usama_crm_manual_events')||'[]')}catch{return[]}}
function saveManualEvents(v){localStorage.setItem('usama_crm_manual_events',JSON.stringify(v))}
async function loadCalendar(){
 document.getElementById('monthTitle').textContent=cursor.toLocaleDateString('en-AE',{month:'long',year:'numeric'});
 const s=startGrid(cursor),e=endGrid(cursor);
 const [or,lr]=await Promise.all([
  db.from('owner_activities').select('*').gte('created_at',s.toISOString()).lte('created_at',e.toISOString()).like('activity_type','Scheduled:%').order('created_at'),
  db.from('lead_activities').select('*').gte('created_at',s.toISOString()).lte('created_at',e.toISOString()).like('activity_type','Scheduled:%').order('created_at')
 ]);
 if(or.error||lr.error){document.getElementById('grid').innerHTML=`<div class="empty">${esc(or.error?.message||lr.error?.message)}</div>`;return}
 const oa=or.data||[],la=lr.data||[],oids=[...new Set(oa.map(x=>x.owner_id).filter(Boolean))],lids=[...new Set(la.map(x=>x.lead_id).filter(Boolean))];
 const [om,lm]=await Promise.all([
  oids.length?db.from('owners').select('id,owner,community,cluster,unit').in('id',oids):Promise.resolve({data:[]}),
  lids.length?db.from('leads').select('id,name,project_inquired').in('id',lids):Promise.resolve({data:[]})
 ]);
 const oMap=Object.fromEntries((om.data||[]).map(x=>[String(x.id),x])),lMap=Object.fromEntries((lm.data||[]).map(x=>[String(x.id),x]));
 events=[
  ...oa.map(a=>{const o=oMap[String(a.owner_id)]||{};return{id:a.id,table:'owner_activities',personId:a.owner_id,when:a.created_at,kind:'owner',name:o.owner||'Owner',sub:[o.community,o.cluster,o.unit?`Unit ${o.unit}`:''].filter(Boolean).join(' · '),type:String(a.activity_type||'').replace('Scheduled: ','')||'Event',location:a.details||''}}),
  ...la.map(a=>{const l=lMap[String(a.lead_id)]||{};return{id:a.id,table:'lead_activities',personId:a.lead_id,when:a.created_at,kind:'lead',name:l.name||'Lead',sub:l.project_inquired||'',type:String(a.activity_type||'').replace('Scheduled: ','')||'Event',location:a.details||''}}),
  ...manualEvents().filter(x=>new Date(x.when)>=s&&new Date(x.when)<=e)
 ].sort((a,b)=>new Date(a.when)-new Date(b.when));
 events.forEach((e,i)=>e.index=i);render(s)
}
function render(start){
 const by={};events.forEach(e=>(by[key(new Date(e.when))]??=[]).push(e));let html='',d=new Date(start),today=key(new Date());
 for(let i=0;i<42;i++){
  const k=key(d),list=by[k]||[],other=d.getMonth()!==cursor.getMonth();
  html+=`<div class="day ${other?'other':''} ${k===today?'today':''}" ondblclick="openCreate('${k}')"><div class="num">${d.getDate()}</div>${list.slice(0,2).map(e=>`<button class="event ${e.kind||'manual'}" onclick="openEdit(${e.index})" title="${esc(e.type+' — '+e.name)}"><b>${esc(fmtTime(e.when))}</b> ${esc(e.type)} · ${esc(e.name)}</button>`).join('')}${list.length>2?`<div class="more" onclick="showDay('${k}')">+${list.length-2} more</div>`:''}</div>`;
  d.setDate(d.getDate()+1)
 }
 document.getElementById('grid').innerHTML=html;
 const up=events.filter(e=>new Date(e.when)>=new Date()).slice(0,30);
 document.getElementById('upcoming').innerHTML=up.length?up.map(e=>`<div class="upItem" onclick="openEdit(${e.index})"><div class="upDate">${esc(fmtDate(e.when))} · ${esc(fmtTime(e.when))}</div><div class="upName">${esc(e.type)} — ${esc(e.name)}</div><div class="upSub">${esc(e.sub||'')}${e.location?`<br>📍 ${esc(e.location)}`:''}</div></div>`).join(''):'<div class="empty">No upcoming events</div>'
}
function showDay(k){const list=events.filter(e=>key(new Date(e.when))===k);document.getElementById('upcoming').innerHTML=list.map(e=>`<div class="upItem" onclick="openEdit(${e.index})"><div class="upDate">${esc(fmtTime(e.when))}</div><div class="upName">${esc(e.type)} — ${esc(e.name)}</div><div class="upSub">${esc(e.sub||'')}${e.location?`<br>📍 ${esc(e.location)}`:''}</div></div>`).join('')}
function openCreate(k=''){editing=null;document.getElementById('modalTitle').textContent='Create Event';document.getElementById('deleteBtn').classList.add('hidden');document.getElementById('type').value='Meeting';document.getElementById('source').value='lead';document.getElementById('searchInput').value='';document.getElementById('manualName').value='';document.getElementById('personId').value='';document.getElementById('date').value=k||key(new Date());document.getElementById('time').value='09:00';document.getElementById('title').value='';document.getElementById('location').value='';sourceChanged();document.getElementById('backdrop').classList.add('show')}
function openEdit(i){const e=events[i];editing=e;document.getElementById('modalTitle').textContent='Edit Event';document.getElementById('deleteBtn').classList.remove('hidden');document.getElementById('type').value=e.type;document.getElementById('source').value=e.kind||'manual';document.getElementById('searchInput').value=e.name;document.getElementById('manualName').value=e.name;document.getElementById('personId').value=e.personId||'';const d=new Date(e.when);document.getElementById('date').value=key(d);document.getElementById('time').value=`${pad(d.getHours())}:${pad(d.getMinutes())}`;document.getElementById('title').value=e.title||e.type;document.getElementById('location').value=e.location||'';sourceChanged(false);document.getElementById('backdrop').classList.add('show')}
function closeModal(){document.getElementById('backdrop').classList.remove('show');document.getElementById('results').classList.remove('show')}
function sourceChanged(clear=true){const s=document.getElementById('source').value;document.getElementById('searchWrap').classList.toggle('hidden',s==='manual');document.getElementById('manualWrap').classList.toggle('hidden',s!=='manual');if(clear){document.getElementById('searchInput').value='';document.getElementById('personId').value=''}rows=[]}
async function searchPeople(){const term=document.getElementById('searchInput').value.trim(),box=document.getElementById('results');if(term.length<2){box.classList.remove('show');return}const src=document.getElementById('source').value;let r;if(src==='lead')r=await db.from('leads').select('id,name,project_inquired').or(`name.ilike.%${term}%,project_inquired.ilike.%${term}%`).limit(15);else r=await db.from('owners').select('id,owner,community,cluster,unit').or(`owner.ilike.%${term}%,community.ilike.%${term}%,cluster.ilike.%${term}%`).limit(15);rows=r.data||[];box.innerHTML=rows.length?rows.map((x,i)=>`<div class="result" onclick="choosePerson(${i})"><strong>${esc(src==='lead'?x.name:x.owner)}</strong><div class="muted">${esc(src==='lead'?(x.project_inquired||''):[x.community,x.cluster,x.unit?`Unit ${x.unit}`:''].filter(Boolean).join(' · '))}</div></div>`).join(''):'<div class="result">No matches</div>';box.classList.add('show')}
function choosePerson(i){const x=rows[i],src=document.getElementById('source').value;document.getElementById('personId').value=x.id;document.getElementById('searchInput').value=src==='lead'?x.name:x.owner;document.getElementById('results').classList.remove('show')}
async function saveEvent(){const src=document.getElementById('source').value,type=document.getElementById('type').value,date=document.getElementById('date').value,time=document.getElementById('time').value,title=document.getElementById('title').value.trim()||type,location=document.getElementById('location').value.trim(),when=new Date(`${date}T${time}:00`).toISOString();if(!date||!time){alert('Select date and time');return}if(src==='manual'){const name=document.getElementById('manualName').value.trim();if(!name){alert('Enter person name');return}let list=manualEvents();if(editing&&editing.table==='manual')list=list.map(x=>String(x.id)===String(editing.id)?{...x,type,name,title,location,when}:x);else list.push({id:`manual_${Date.now()}`,table:'manual',kind:'manual',type,name,title,location,when,sub:''});saveManualEvents(list);closeModal();loadCalendar();return}const personId=document.getElementById('personId').value;if(!personId){alert('Search and select a participant');return}const table=src==='lead'?'lead_activities':'owner_activities',idField=src==='lead'?'lead_id':'owner_id',payload={[idField]:personId,activity_type:`Scheduled: ${type}`,details:location,created_at:when};let result;if(editing&&editing.table===table)result=await db.from(table).update(payload).eq('id',editing.id);else result=await db.from(table).insert(payload);if(result.error){alert(result.error.message);return}closeModal();loadCalendar()}
async function deleteEvent(){if(!editing||!confirm('Delete this event?'))return;if(editing.table==='manual'){saveManualEvents(manualEvents().filter(x=>String(x.id)!==String(editing.id)))}else{const {error}=await db.from(editing.table).delete().eq('id',editing.id);if(error){alert(error.message);return}}closeModal();loadCalendar()}
loadCalendar();
</script>
</body>
</html>
