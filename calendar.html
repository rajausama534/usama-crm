<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usama CRM Calendar</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#05070c;color:#eef4ff;font-family:Poppins,sans-serif;padding:18px}.wrap{max-width:1700px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.top h1{margin:0;font-size:25px}.top p{margin:4px 0;color:#94a3b8;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.btn{font:inherit;color:#fff;background:#0b1220;border:1px solid rgba(148,163,184,.2);border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:600;text-decoration:none}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.panel{background:#07101c;border:1px solid rgba(148,163,184,.14);border-radius:13px;overflow:hidden}.calHead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(148,163,184,.14)}#monthTitle{font-size:18px;font-weight:700}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week div{padding:10px;text-align:center;color:#94a3b8;font-size:12px;font-weight:600;border-right:1px solid rgba(148,163,184,.1)}.day{min-height:124px;padding:8px;border-top:1px solid rgba(148,163,184,.1);border-right:1px solid rgba(148,163,184,.1);background:#060c16}.day.other{opacity:.38}.day.today{box-shadow:inset 0 0 0 2px #2563eb}.num{font-size:12px;font-weight:700;margin-bottom:6px}.event{display:block;width:100%;text-align:left;margin:4px 0;padding:5px 7px;border-radius:6px;background:rgba(37,99,235,.18);border-left:3px solid #3b82f6;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.event.owner{background:rgba(16,185,129,.15);border-left-color:#10b981}.sideTitle{padding:14px;border-bottom:1px solid rgba(148,163,184,.14);font-weight:700}.upcoming{max-height:760px;overflow:auto}.upItem{padding:12px 14px;border-bottom:1px solid rgba(148,163,184,.1)}.upDate{font-size:11px;color:#60a5fa;font-weight:700}.upName{font-size:13px;font-weight:600;margin-top:3px}.upSub{font-size:11px;color:#94a3b8;margin-top:2px;line-height:1.4}.empty,.loading{padding:24px;color:#94a3b8;text-align:center}@media(max-width:900px){body{padding:10px}.layout{grid-template-columns:1fr}.day{min-height:92px;padding:5px}.event{font-size:10px;padding:4px}.week div{padding:7px 2px}}</style></head><body><div class="wrap"><div class="top"><div><h1>Calendar</h1><p>Meetings, calls, viewings and follow-ups</p></div><div class="actions"><a class="btn" href="/">Back to CRM</a><button onclick="goToday()">Today</button><button onclick="changeMonth(-1)">←</button><button onclick="changeMonth(1)">→</button></div></div><div class="layout"><div class="panel"><div class="calHead"><span id="monthTitle"></span><button onclick="loadCalendar()">Refresh</button></div><div class="week"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div><div id="calendarGrid" class="grid"><div class="loading">Loading…</div></div></div><div class="panel"><div class="sideTitle">Upcoming Events</div><div id="upcoming" class="upcoming"><div class="loading">Loading…</div></div></div></div></div><script>const db=supabase.createClient('https://vnydxkmhrcesdffpfjpc.supabase.co','sb_publishable_VP8ZvA5up64JFGkn5_7qbg_NYVJvt-I');let viewDate=new Date();viewDate.setDate(1);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;function goToday(){viewDate=new Date();viewDate.setDate(1);loadCalendar()}function changeMonth(n){viewDate.setMonth(viewDate.getMonth()+n);loadCalendar()}function startOfGrid(d){const x=new Date(d.getFullYear(),d.getMonth(),1),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}function endOfGrid(d){const x=startOfGrid(d);x.setDate(x.getDate()+41);x.setHours(23,59,59,999);return x}function fmtTime(v){return new Date(v).toLocaleTimeString('en-AE',{hour:'2-digit',minute:'2-digit',hour12:true})}function fmtDate(v){return new Date(v).toLocaleDateString('en-AE',{weekday:'short',day:'numeric',month:'short'})}async function loadCalendar(){document.getElementById('monthTitle').textContent=viewDate.toLocaleDateString('en-AE',{month:'long',year:'numeric'});const start=startOfGrid(viewDate),end=endOfGrid(viewDate);const [or,lr]=await Promise.all([db.from('owner_activities').select('*').gte('created_at',start.toISOString()).lte('created_at',end.toISOString()).like('activity_type','Scheduled:%').order('created_at'),db.from('lead_activities').select('*').gte('created_at',start.toISOString()).lte('created_at',end.toISOString()).like('activity_type','Scheduled:%').order('created_at')]);if(or.error||lr.error){document.getElementById('calendarGrid').innerHTML=`<div class="empty">${esc(or.error?.message||lr.error?.message)}</div>`;return}const owners=or.data||[],leads=lr.data||[];const ownerIds=[...new Set(owners.map(x=>x.owner_id).filter(Boolean))],leadIds=[...new Set(leads.map(x=>x.lead_id).filter(Boolean))];const [om,lm]=await Promise.all([ownerIds.length?db.from('owners').select('id,owner,community,cluster,unit').in('id',ownerIds):Promise.resolve({data:[]}),leadIds.length?db.from('leads').select('id,name,project_inquired').in('id',leadIds):Promise.resolve({data:[]})]);const ownerMap=Object.fromEntries((om.data||[]).map(x=>[String(x.id),x])),leadMap=Object.fromEntries((lm.data||[]).map(x=>[String(x.id),x]));const events=[...owners.map(a=>{const o=ownerMap[String(a.owner_id)]||{};return{when:a.created_at,kind:'owner',name:o.owner||'Owner',sub:`${o.community||''} ${o.cluster||''} ${o.unit?`· Unit ${o.unit}`:''}`,type:(a.activity_type||'').replace('Scheduled: ','')||'Event',details:a.details||''}}),...leads.map(a=>{const l=leadMap[String(a.lead_id)]||{};return{when:a.created_at,kind:'lead',name:l.name||'Lead',sub:l.project_inquired||'',type:(a.activity_type||'').replace('Scheduled: ','')||'Event',details:a.details||''}})].sort((a,b)=>new Date(a.when)-new Date(b.when));const byDay={};events.forEach(e=>(byDay[key(new Date(e.when))]??=[]).push(e));const todayKey=key(new Date());let html='',cursor=new Date(start);for(let i=0;i<42;i++){const k=key(cursor),items=byDay[k]||[],other=cursor.getMonth()!==viewDate.getMonth();html+=`<div class="day ${other?'other':''} ${k===todayKey?'today':''}"><div class="num">${cursor.getDate()}</div>${items.slice(0,4).map(e=>`<div class="event ${e.kind==='owner'?'owner':''}" title="${esc(e.type+' - '+e.name+' - '+e.details)}"><b>${esc(fmtTime(e.when))}</b> ${esc(e.type)} · ${esc(e.name)}</div>`).join('')}${items.length>4?`<div class="event">+${items.length-4} more</div>`:''}</div>`;cursor.setDate(cursor.getDate()+1)}document.getElementById('calendarGrid').innerHTML=html;const now=new Date(),up=events.filter(e=>new Date(e.when)>=now).slice(0,30);document.getElementById('upcoming').innerHTML=up.length?up.map(e=>`<div class="upItem"><div class="upDate">${esc(fmtDate(e.when))} · ${esc(fmtTime(e.when))}</div><div class="upName">${esc(e.type)} — ${esc(e.name)}</div><div class="upSub">${esc(e.sub)}${e.details?`<br>${esc(e.details)}`:''}</div></div>`).join(''):'<div class="empty">No upcoming scheduled events</div>'}loadCalendar();</script></body></html>
