name: Install CRM Enhancements

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-calendar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject enhancement files into CRM
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); css='<link rel=\"stylesheet\" href=\"crm-cleanup.css?v=2\">'; js='<script src=\"crm-enhancements.js?v=2\"></script>'; s=s if css in s else s.replace('</head>',css+'\\n</head>'); s=s if js in s else s.replace('</body>',js+'\\n</body>'); p.write_text(s)"

      - name: Commit patched index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Connect premium calendar and clean lead layout"
          git push
