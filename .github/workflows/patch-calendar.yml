name: Install Monthly CRM Calendar

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-calendar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect Calendar tab to monthly calendar
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '</script>'
          patch = '''

          /* Calendar tab fix: open the full monthly calendar page. */
          showCalendarModule = async function(){
            window.location.href = "calendar.html";
          };
          '''

          if 'Calendar tab fix: open the full monthly calendar page.' not in text:
              position = text.rfind(marker)
              if position < 0:
                  raise SystemExit('Closing script tag not found')
              text = text[:position] + patch + text[position:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit calendar fix
        run: |
          if git diff --quiet; then
            echo "Calendar fix already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect CRM Calendar tab to monthly calendar"
          git push
