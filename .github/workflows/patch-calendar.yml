name: Install CRM Enhancements

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-calendar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject and refresh CRM enhancement assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="crm-cleanup.css?v=3">'
          js='<script src="crm-enhancements.js?v=3"></script>'
          import re
          s=re.sub(r'<link rel="stylesheet" href="crm-cleanup\.css\?v=\d+">',css,s)
          s=re.sub(r'<script src="crm-enhancements\.js\?v=\d+"></script>',js,s)
          if css not in s:s=s.replace('</head>',css+'\n</head>')
          if js not in s:s=s.replace('</body>',js+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit patched index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Deploy CRM calendar and lead layout refinements"
          git push